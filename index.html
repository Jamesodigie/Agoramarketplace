<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0060FD">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agora">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Agora Marketplace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-sized app column; screens swap inside it. Tokens follow the Agora Figma file. */
:root{
  --blue:#005AE6; --blue-600:#004CC4; --blue-50:#E6EFFD;
  --navy:#0B3C91; --navy-deep:#072A6B;
  --ink:#0F1729; --muted:#6B7280; --faint:#9AA3B2;
  --bg:#F3F5F8; --card:#FFFFFF; --line:#E4E8EF;
  --green:#22C55E; --green-ink:#15803D; --green-50:#E7F7ED;
  --amber:#F59E0B; --amber-ink:#B45309; --amber-50:#FEF5DF;
  --red:#EF4444; --red-50:#FDECEC;
  --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#DCE3EE;-webkit-tap-highlight-color:transparent;touch-action:manipulation;color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.shell{height:100%;display:flex;align-items:center;justify-content:center}
#app{position:relative;width:100%;max-width:430px;height:100%;background:var(--bg);overflow:hidden}
@media (min-width:600px) and (min-height:760px){
  #app{height:min(874px,calc(100% - 40px));border-radius:36px;box-shadow:0 30px 80px rgba(7,42,107,.28),0 0 0 10px #0E1626}
}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  animation:enter .32s cubic-bezier(.2,.8,.2,1)}
.screen.back-anim{animation:enterBack .32s cubic-bezier(.2,.8,.2,1)}
.screen.fade{animation:fadeIn .5s ease}
.screen.still{animation:none}
.screen > *,.welcome > *,.onb > *{flex-shrink:0}
.welcome .mid,.onb .stage{flex-shrink:1}
@keyframes enter{from{transform:translateX(28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes enterBack{from{transform:translateX(-28px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- Hero / pattern ---------- */
.hero{overflow:hidden;background:radial-gradient(120% 70% at 50% 38%,#1550B8 0%,var(--navy) 45%,var(--navy-deep) 100%);color:#fff;padding:0;isolation:isolate}
.pattern{position:absolute;inset:-130px;background-size:130px 130px;animation:drift 38s linear infinite;z-index:-1;pointer-events:none;transition:transform .6s ease-out}
.pattern.b{animation:drift 38s linear infinite reverse,twinkle 7s ease-in-out infinite;background-size:130px 130px;background-position:65px 65px}
@keyframes drift{from{background-position:0 0}to{background-position:130px -130px}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.hero-glow{position:absolute;left:50%;top:36%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;
  background:radial-gradient(circle,rgba(70,140,255,.45),rgba(70,140,255,0) 65%);z-index:-1;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
.sweep{position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.07) 50%,transparent 65%);background-size:250% 100%;animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%{background-position:120% 0}60%,100%{background-position:-120% 0}}

.logo-wrap{position:relative;width:96px;height:104px;margin:0 auto}
.logo-wrap .ring{position:absolute;left:50%;top:58%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:2px solid rgba(120,175,255,.55);animation:ring 2.8s ease-out infinite}
.logo-wrap .ring:nth-child(2){animation-delay:1.4s}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.1);opacity:0}}
.logo-drop{animation:drop 1s cubic-bezier(.34,1.56,.64,1) both;position:relative}
@keyframes drop{0%{transform:translateY(-70px) scale(.55) rotate(-8deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.logo-float{animation:float 4s ease-in-out 1s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.check-draw{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .55s ease-out .75s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
.word{display:inline-block;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}

.welcome{display:flex;flex-direction:column;height:100%;padding:calc(40px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.welcome .mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:22px}
.welcome h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}
.welcome p{margin:0;font-size:14.5px;line-height:1.5;opacity:.88;max-width:300px}
.chips-trust{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chips-trust span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(4px)}
.chips-trust svg{width:14px;height:14px}
.actions{display:flex;flex-direction:column;gap:16px}

/* ---------- Buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:500;transition:transform .12s ease,background .2s,box-shadow .2s;box-shadow:0 6px 16px rgba(0,90,230,.25)}
@media (hover:hover){.btn:hover{background:var(--blue-600)}}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.35);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.outline{background:var(--card);color:var(--blue);border:1.5px solid var(--blue);box-shadow:none}
.btn.success{background:var(--green);box-shadow:0 6px 16px rgba(34,197,94,.3)}
.btn.small{height:44px;font-size:15px;border-radius:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:22px;height:22px}
.link{color:var(--blue);font-weight:600}
.textlink{color:var(--blue);font-weight:500;font-size:14px}

/* ---------- Top bars ---------- */
.topbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:44px;margin-bottom:16px}
.topbar h2{margin:0;text-align:center;font-size:17px;font-weight:600}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;position:relative}
.iconbtn:hover{background:rgba(15,23,41,.05)}
.iconbtn svg{width:24px;height:24px}
.badge{position:absolute;top:3px;right:3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}
.brandbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.brand svg{width:28px;height:30px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FFB38A,#E5533C);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:9px}
.field label{font-size:15px;font-weight:500}
.input{position:relative}
.input input,.input select,.input textarea{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 14px;font-size:16px;outline:none;transition:border .2s,box-shadow .2s;appearance:none}
.input textarea{height:110px;padding:14px;resize:none}
.input input:focus,.input select:focus,.input textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.input .trail{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);display:grid;place-items:center}
.input .trail svg{width:20px;height:20px}
.form{display:flex;flex-direction:column;gap:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.err{color:var(--red);font-size:13px;min-height:0}

.intro{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin:10px 0 30px}
.intro h1{margin:6px 0 0;font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.intro p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:320px}
.intro .icon-lg{width:56px;height:56px;color:var(--blue)}
.mini-logo svg{width:62px;height:68px}

.social{display:flex;align-items:center;justify-content:space-between;width:100%;height:64px;padding:0 20px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:15.5px;font-weight:500;transition:border .2s,transform .12s}
.social:hover{border-color:var(--blue)}
.social:active{transform:scale(.99)}
.social .l{display:flex;align-items:center;gap:16px}
.social svg{width:28px;height:28px}
.social .chev{width:20px;height:20px;color:var(--muted)}
.divider{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:14px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.center-note{text-align:center;color:var(--muted);font-size:14px}
.fine{text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}

.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.check .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);display:grid;place-items:center;transition:all .2s}
.check .box svg{width:14px;height:14px;color:#fff;opacity:0}
.check.on .box{background:var(--blue);border-color:var(--blue)}
.check.on .box svg{opacity:1}

/* ---------- Onboarding carousel ---------- */
.onb{display:flex;flex-direction:column;height:100%;padding:calc(8px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.onb .skip{align-self:flex-end;color:#fff;font-weight:600;font-size:16px;padding:10px 4px}
.onb .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;touch-action:pan-y}
.onb .art{width:300px;max-width:100%;height:220px;display:grid;place-items:center}
.onb .art svg{width:100%;height:100%}
.onb h1{font-size:24px;margin:0 0 10px;font-weight:700}
.onb p{margin:0;font-size:14.5px;line-height:1.5;opacity:.88;max-width:300px}
.dots{display:flex;gap:10px;justify-content:center;margin:26px 0 34px}
.dots i{width:10px;height:10px;border-radius:99px;background:rgba(255,255,255,.35);transition:all .35s}
.dots i.on{width:28px;background:#fff}
.bob{animation:float 3.4s ease-in-out infinite}
.bob2{animation:float 4.2s ease-in-out .6s infinite}
.spin{transform-origin:150px 108px;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pop{animation:pop .6s cubic-bezier(.34,1.56,.64,1) .3s both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.shackle{animation:shackle 2.6s ease-in-out infinite}
@keyframes shackle{0%,55%,100%{transform:translateY(0)}70%{transform:translateY(-6px)}85%{transform:translateY(0)}}

/* ---------- Home ---------- */
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--faint);font-size:14px;width:100%;text-align:left}
.search svg{width:20px;height:20px}
.ordercard{background:var(--card);border-radius:18px;padding:18px;margin-top:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line)}
.oc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oc-head small{display:block;font-size:13px;color:var(--muted)}
.oc-head b{font-size:14px;font-weight:600;letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill svg{width:14px;height:14px}
.pill.green{background:var(--green-50);color:var(--green-ink)}
.pill.amber{background:var(--amber-50);color:var(--amber-ink)}
.pill.blue{background:var(--blue-50);color:var(--blue)}
.pill.red{background:var(--red-50);color:var(--red)}
.pill.grey{background:#EEF0F4;color:var(--muted)}
.oc-item{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.oc-item .meta{flex:1;min-width:0}
.oc-item .meta b{display:block;font-weight:500;font-size:14.5px}
.oc-item .meta span{font-size:13px;color:var(--muted)}
.oc-item .amt{font-weight:600;font-variant-numeric:tabular-nums}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;font-size:13px;line-height:1.4}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.note.amber{background:var(--amber-50);color:var(--amber-ink)}
.note.green{background:var(--green-50);color:var(--green-ink)}
.note.blue{background:var(--blue-50);color:var(--blue)}
.note b{display:block;font-weight:600}
.note span{color:var(--ink);opacity:.75}
.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.progress i{height:4px;border-radius:9px;background:var(--blue-50)}
.progress i.on{background:var(--blue)}

.banner{position:relative;overflow:hidden;margin-top:16px;border-radius:16px;height:122px;background:#15181F;color:#fff;padding:20px;display:flex;flex-direction:column;justify-content:center}
.banner h3{margin:0 0 6px;font-size:21px;font-weight:600;position:relative;z-index:1}
.banner p{margin:0;font-size:12.5px;opacity:.85;position:relative;z-index:1}
.banner .tag{position:absolute;background:#C8102E;color:#FFD9DF;font-weight:800;font-size:11px;letter-spacing:.08em;padding:3px 7px;border-radius:2px;opacity:.85;animation:tag 4s ease-in-out infinite}
@keyframes tag{0%,100%{translate:0 0}50%{translate:0 -4px}}
.cats{display:flex;gap:10px;overflow-x:auto;margin:18px calc(-1*max(20px,env(safe-area-inset-left,0px))) 0;padding:2px max(20px,env(safe-area-inset-left,0px));scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:10px;background:var(--card);font-size:15px;font-weight:500;transition:all .2s}
.cat svg{width:22px;height:22px}
.cat.on{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pcard{background:var(--card);border-radius:16px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .2s;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@media (hover:hover){.pcard:hover{box-shadow:0 8px 24px rgba(15,23,41,.08)}}
.pcard:active{transform:scale(.98)}
.pcard .nm{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .pr{display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-size:14px}
.pcard .pr b{font-weight:600;font-variant-numeric:tabular-nums}
.pcard .sl{font-size:13px;color:var(--muted)}
.rate{display:inline-flex;align-items:center;gap:3px;font-size:13px}
.rate svg{width:12px;height:12px;color:var(--amber)}
.escrow-chip{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--green-50);color:var(--green-ink);font-size:12px;font-weight:500;padding:5px;border-radius:8px}
.escrow-chip svg{width:15px;height:15px;color:var(--green)}
.art{border-radius:12px;display:grid;place-items:center;overflow:hidden;aspect-ratio:1.08;max-width:100%}
.art svg{width:72%;height:72%}

/* ---------- Product ---------- */
.hero-img{border-radius:18px;aspect-ratio:1.22;max-width:100%}
.hero-img svg{width:62%;height:62%}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.thumbs button{border-radius:10px;overflow:hidden;border:2px solid transparent;transition:border .2s}
.thumbs button.on{border-color:var(--blue)}
.thumbs .art{aspect-ratio:1.2;border-radius:8px}
.pd-title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:20px}
.pd-title h1{margin:0;font-size:22px;font-weight:700;line-height:1.2}
.pd-title .price{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.subrow{display:flex;gap:10px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.small-note{font-size:12.5px;margin-top:10px}
.sizes{display:flex;gap:10px;margin-top:12px}
.sizes button{min-width:46px;height:32px;padding:0 14px;border-radius:8px;background:#C9DAF8;color:#fff;font-weight:600;font-size:15px;transition:all .2s}
.sizes button.on{background:var(--blue)}
.sellerrow{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:12px;padding:12px 14px;margin-top:20px}
.sellerrow .ic{width:32px;height:32px;color:var(--blue)}
.sellerrow b{display:block;font-size:14.5px;font-weight:600}
.sellerrow span{font-size:12.5px;color:var(--muted)}
.escrow-box{display:flex;gap:12px;background:var(--green-50);border-radius:14px;padding:18px 16px;margin-top:16px}
.escrow-box svg{width:26px;height:26px;color:var(--green);flex:none;margin-top:6px}
.escrow-box b{color:var(--green);font-weight:600;font-size:15.5px}
.escrow-box p{margin:4px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.about{margin-top:18px}
.about b{font-size:14.5px;font-weight:600}
.about p{margin:6px 0 0;color:var(--muted);font-size:13.5px;line-height:1.5}
.sticky-cta{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));margin:auto calc(-1*max(20px,env(safe-area-inset-left,0px))) calc(-24px - env(safe-area-inset-bottom,0px));padding:16px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(243,245,248,0));display:flex;flex-direction:column;gap:12px}
.spacer{flex:1;min-height:24px}

/* ---------- Cart ---------- */
.citem{display:flex;gap:14px;background:var(--card);border-radius:14px;padding:11px;position:relative;animation:rise .4s ease both}
.citem .art{width:94px;aspect-ratio:1.08;flex:none}
.citem .info{flex:1;display:flex;flex-direction:column;gap:2px;padding-top:10px;min-width:0}
.citem .info b{font-weight:500;font-size:14.5px}
.citem .info span{font-size:13px;color:var(--muted)}
.qty{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;margin-top:auto;align-self:flex-start;padding:2px}
.qty button{width:26px;height:24px;display:grid;place-items:center;border-radius:6px}
.qty button:hover{background:var(--bg)}
.qty button svg{width:14px;height:14px}
.qty output{min-width:16px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.citem .trash{position:absolute;right:12px;top:14px;color:var(--muted)}
.citem .trash svg{width:22px;height:22px}
.citem .amt{position:absolute;right:14px;bottom:16px;font-weight:600;font-variant-numeric:tabular-nums}
.sumrows{display:flex;flex-direction:column;gap:12px;font-variant-numeric:tabular-nums}
.sumrows div{display:flex;justify-content:space-between;font-size:15px}
.sumrows .total{font-size:18px;font-weight:700}
.panel{background:var(--card);border-radius:16px;padding:18px 20px}
.list-gap{display:flex;flex-direction:column;gap:14px}

/* ---------- Checkout ---------- */
.stepper{display:flex;align-items:flex-start;justify-content:space-between;margin:4px 6px 28px}
.step{display:flex;flex-direction:column;align-items:center;gap:8px;width:62px;font-size:13.5px}
.step i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:600;border:1.5px solid var(--faint);color:var(--muted);background:var(--card);transition:all .3s}
.step.on i,.step.done i{background:var(--blue);border-color:var(--blue);color:#fff}
.step i svg{width:14px;height:14px}
.bar{flex:1;height:3px;margin-top:13px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.bar.on::after{content:"";position:absolute;inset:0;background:var(--blue);animation:fill .5s ease both}
@keyframes fill{from{transform:translateX(-100%)}to{transform:none}}
.sect{font-size:18px;font-weight:600;margin:6px 0 16px}
.radio-card{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:left;transition:border .2s,background .2s}
.radio-card.on{border-color:var(--blue);background:#F7FAFF}
.radio-card .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;flex:none}
.radio-card.on .dot{border-color:var(--blue)}
.radio-card.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}
.radio-card .ic{width:28px;height:28px;color:var(--blue);flex:none}
.radio-card .t{flex:1}
.radio-card .t b{display:block;font-weight:600;font-size:15px}
.radio-card .t span{font-size:13px;color:var(--muted)}
.radio-card .p{font-weight:600;font-variant-numeric:tabular-nums}
.addr{display:flex;gap:14px;align-items:flex-start}
.addr svg{width:24px;height:24px;color:var(--blue);flex:none}
.addr b{font-weight:600}
.addr p{margin:6px 0 0;color:var(--muted);font-size:14px;line-height:1.55}
.money{background:var(--green-50);border-radius:16px;padding:18px 20px}
.money h4{margin:0 0 12px;color:var(--green);display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.money h4 svg{width:16px;height:16px}
.money ul{list-style:none;margin:0;padding:0 0 0 24px;display:flex;flex-direction:column;gap:9px}
.money li{position:relative;font-size:13.5px;line-height:1.4}
.money li svg{position:absolute;left:-22px;top:1px;width:15px;height:15px}
.acct{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.acct:last-child{border:0}
.acct small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.acct b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.copy{display:flex;align-items:center;gap:6px;color:var(--blue);font-size:13px;font-weight:600}
.copy svg{width:18px;height:18px}

/* ---------- Status screens ---------- */
.status{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;margin:40px 0 34px;position:relative}
.status h1{margin:8px 0 0;font-size:24px;font-weight:700}
.status p{margin:0;color:var(--muted);line-height:1.5;max-width:310px;font-size:14.5px}
.badge-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;animation:pop .55s cubic-bezier(.34,1.56,.64,1) both}
.badge-ic svg{width:32px;height:32px}
.badge-ic.green{background:var(--green);color:#fff;box-shadow:0 0 0 10px var(--green-50)}
.badge-ic.amber{background:var(--amber-50);color:var(--amber)}
.badge-ic.red{background:var(--red-50);color:var(--red)}
.badge-ic.blue{background:var(--blue-50);color:var(--blue)}
.confetti{position:absolute;left:50%;top:30px;width:0;height:0;pointer-events:none}
.confetti i{position:absolute;width:7px;height:11px;border-radius:2px;opacity:0;animation:burst 1.2s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes burst{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}

/* ---------- Tracking ---------- */
.track{background:var(--card);border-radius:18px;padding:20px}
.tl{display:flex;flex-direction:column;margin-top:22px}
.tl .st{display:flex;gap:18px;position:relative;padding-bottom:30px}
.tl .st:last-child{padding-bottom:0}
.tl .st::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl .st.done::before{background:var(--green)}
.tl .st:last-child::before{display:none}
.tl .dot{width:24px;height:24px;border-radius:50%;background:#EEF0F4;display:grid;place-items:center;flex:none;position:relative;z-index:1;transition:background .3s}
.tl .done .dot{background:var(--green);color:#fff}
.tl .now .dot{background:var(--blue-50);box-shadow:0 0 0 0 rgba(0,90,230,.4);animation:pulse 1.6s infinite}
.tl .now .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,90,230,.35)}100%{box-shadow:0 0 0 12px rgba(0,90,230,0)}}
.tl .dot svg{width:12px;height:12px}
.tl b{display:block;font-weight:500;font-size:15px}
.tl span{font-size:13.5px;color:var(--muted)}
.demo{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);border:1px dashed var(--faint);border-radius:10px;padding:9px;width:100%;background:transparent}
.demo:hover{color:var(--blue);border-color:var(--blue)}
.demo svg{width:15px;height:15px}
.photo-box{border-radius:18px;background:#E9EDF3;aspect-ratio:1.35;max-width:100%;display:grid;place-items:center;overflow:hidden;border:2px dashed #C6CEDB;color:var(--muted);text-align:center;cursor:pointer}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box svg{width:44px;height:44px;color:var(--blue)}
.stars{display:flex;gap:12px;justify-content:center}
.stars button svg{width:36px;height:36px;color:#D5DAE3;transition:color .15s,transform .15s}
.stars button.on svg{color:var(--amber)}
.stars button:active svg{transform:scale(1.2)}

/* ---------- Profile / lists ---------- */
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 24px}
.prof .avatar{width:96px;height:96px;font-size:32px;border-radius:24px}
.prof b{font-size:17px;font-weight:600}
.prof span{color:var(--muted);font-size:14px}
.menu{display:flex;flex-direction:column;gap:12px}
.menu button{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:12px;height:56px;padding:0 16px;font-size:15.5px;font-weight:500;width:100%;text-align:left;transition:background .2s}
.menu button:hover{background:#FBFCFE}
.menu button > svg:first-child{width:22px;height:22px;color:var(--blue)}
.menu button .chev{margin-left:auto;width:18px;height:18px;color:var(--faint)}
.sellcard{background:var(--blue-50);border-radius:16px;padding:18px 20px;margin-top:24px}
.sellcard b{font-size:16px;font-weight:600}
.sellcard p{margin:6px 0 14px;color:var(--muted);font-size:14px;line-height:1.45}
.sellcard button{display:inline-flex;align-items:center;gap:10px;background:var(--blue);color:#fff;border-radius:10px;padding:11px 14px;font-weight:500}
.sellcard button svg{width:20px;height:20px}
.tabs{display:flex;gap:10px;overflow-x:auto;margin-bottom:20px;scrollbar-width:none}
.tabs button{flex:none;height:38px;padding:0 14px;border-radius:10px;background:var(--card);font-size:14.5px;font-weight:500}
.tabs button.on{background:var(--blue);color:#fff}
.orow{background:var(--card);border-radius:16px;padding:18px;display:grid;grid-template-columns:86px 1fr;gap:6px 16px;animation:rise .4s ease both}
.orow .art{grid-row:span 2;aspect-ratio:1.2;width:86px}
.orow .t b{display:block;font-weight:600;font-size:15px}
.orow .t span{display:block;color:var(--muted);font-size:13.5px;line-height:1.6}
.orow .bt{grid-column:2;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.orow .bt b{font-variant-numeric:tabular-nums}
.orow .bt button{background:var(--blue-50);color:var(--blue);font-size:13.5px;font-weight:600;padding:9px 12px;border-radius:9px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 10px}
.empty svg{width:64px;height:64px;color:var(--blue)}
.empty b{font-size:18px;font-weight:600}
.empty p{margin:0 0 10px;color:var(--muted);line-height:1.5;font-size:14px;max-width:300px}
.addrcard{background:var(--card);border-radius:16px;padding:16px 18px;display:flex;gap:16px;align-items:flex-start}
.addrcard .hm{width:44px;height:44px;border-radius:12px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;flex:none}
.addrcard .hm svg{width:24px;height:24px}
.addrcard .tx{flex:1}
.addrcard .tx b{font-weight:600;display:inline-flex;align-items:center;gap:8px}
.addrcard .tx p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
.steps4{display:flex;flex-direction:column;margin:26px 0;padding-left:8px}
.steps4 .st{display:flex;gap:18px;position:relative;padding-bottom:26px}
.steps4 .st:last-child{padding-bottom:0}
.steps4 .st::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--green)}
.steps4 .st:last-child::before{display:none}
.steps4 .n{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.steps4 b{display:block;font-weight:600}
.steps4 span{font-size:14px;color:var(--muted)}
.toggle{width:51px;height:31px;border-radius:99px;background:#D5DAE3;position:relative;transition:background .25s;flex:none}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(20px)}
.setrow{display:flex;align-items:flex-start;gap:14px;background:var(--card);border-radius:14px;padding:18px}
.setrow svg{width:22px;height:22px;color:var(--blue);flex:none}
.setrow .tx{flex:1}
.setrow b{display:block;font-weight:600;font-size:15px}
.setrow span{font-size:13.5px;color:var(--muted);line-height:1.45}

/* ---------- Seller ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0 28px}
.stat{background:var(--card);border-radius:12px;padding:12px;text-align:center;transition:transform .15s}
.stat:active{transform:scale(.97)}
.stat b{display:block;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.stat.g b{color:var(--green)}
.stat.b b{color:var(--blue)}
.greet h1{margin:0;font-size:24px;font-weight:700}
.verified{display:inline-flex;align-items:center;gap:5px;color:var(--green);font-size:13px;margin-top:6px}
.verified svg{width:15px;height:15px}
.sechead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sechead b{font-size:17px;font-weight:600}
.srow{background:var(--card);border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:14px;animation:rise .4s ease both}
.srow .art{width:72px;aspect-ratio:1.25;flex:none}
.srow .tx{flex:1;min-width:0}
.srow .tx span{display:block;color:var(--muted);font-size:13.5px;line-height:1.6}
.srow .tx b{font-variant-numeric:tabular-nums}
.bigsum{background:var(--blue);color:#fff;border-radius:16px;padding:20px;display:flex;align-items:center;gap:14px}
.bigsum svg{width:28px;height:28px}
.bigsum .tx{flex:1}
.bigsum small{display:block;opacity:.8;font-size:13px}
.bigsum b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.upload{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:180px;border-radius:14px;border:1.5px dashed #BFC8D6;background:var(--card);color:var(--muted);cursor:pointer;transition:border .2s;overflow:hidden}
.upload:hover{border-color:var(--blue)}
.upload svg{width:40px;height:40px;color:var(--blue)}
.upload img{width:100%;height:100%;object-fit:cover}
.imgs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.imgs label,.imgs div{aspect-ratio:1;border-radius:10px;background:var(--card);border:1.5px dashed #BFC8D6;display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--blue)}
.imgs img{width:100%;height:100%;object-fit:cover}
.imgs svg{width:22px;height:22px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Search ---------- */
.searchbar{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.searchbar .input{flex:1}
.searchbar input{padding-left:42px!important;height:46px!important}
.searchbar .lead{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.searchbar .lead svg{width:20px;height:20px}
.recent{display:flex;flex-direction:column;gap:4px;margin:12px 0 26px}
.recent div{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.recent button.q{font-size:15px;text-align:left;flex:1}
.recent svg{width:16px;height:16px;color:var(--muted)}
.ctiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 12px;margin:14px 0 26px}
.ctiles button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px}
.ctiles .art{width:100%;aspect-ratio:1.1;border-radius:12px}
.ctiles .art svg{width:66%;height:66%}

/* ---------- Toast / overlay / sheet ---------- */
.toast{position:absolute;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);z-index:50;max-width:calc(100% - 40px);white-space:nowrap}
.toast svg{width:18px;height:18px;color:var(--green)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.overlay{position:absolute;inset:0;background:rgba(15,23,41,.45);z-index:40;display:grid;place-items:center;animation:fadeIn .2s}
.processing{background:var(--card);border-radius:20px;padding:28px 26px;text-align:center;width:min(300px,86%);display:flex;flex-direction:column;gap:12px;align-items:center}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--blue-50);border-top-color:var(--blue);animation:spin2 .8s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.processing b{font-size:16px}
.processing span{color:var(--muted);font-size:13.5px;line-height:1.4}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));z-index:41;animation:sheet .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:14px}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:-8px auto 4px}
.sheet h3{margin:0;font-size:18px}
.sheet p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.otp{display:flex;gap:12px;justify-content:center}
.otp input{width:58px;height:62px;text-align:center;font-size:24px;font-weight:600;border:1px solid var(--line);border-radius:14px;background:var(--card);outline:none}
.otp input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}

@media (max-height:640px){.welcome .mid{gap:14px}.welcome h1{font-size:26px}.onb .art{height:170px}.onb .stage{gap:20px}.dots{margin:16px 0 20px}.status{margin:20px 0 22px}.intro{margin-bottom:20px}}
@media (max-width:350px){.stats{gap:8px}.stat b{font-size:13px}.pd-title h1,.pd-title .price{font-size:19px}.otp input{width:50px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .check-draw{stroke-dashoffset:0}
}

/* =================== v2: softer system, new intro, seller verification =================== */
:root{
  --brand:#0060FD; --bg:#F4F6FA; --line:#E7EBF2; --blue-100:#D6E4FF;
  --spring:cubic-bezier(.34,1.36,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  --sh-1:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05);
  --sh-2:0 2px 6px rgba(16,24,40,.06),0 18px 40px rgba(16,24,40,.10);
}
.screen{animation:enter2 .5s var(--ease)}
.screen.back-anim{animation:enterBack2 .5s var(--ease)}
.screen.bare{padding:0}
@keyframes enter2{from{transform:translateX(22px);opacity:0}to{transform:none;opacity:1}}
@keyframes enterBack2{from{transform:translateX(-22px);opacity:0}to{transform:none;opacity:1}}

/* soft surfaces + springy presses */
.btn{border-radius:16px;transition:transform .35s var(--spring),background .25s,box-shadow .3s,opacity .3s}
.btn:active{transform:scale(.97)}
.input input,.input select,.input textarea{border-radius:14px;border-color:var(--line);transition:border-color .2s,box-shadow .3s}
.input input:focus,.input select:focus,.input textarea:focus{box-shadow:0 0 0 4px rgba(0,96,253,.12)}
.ordercard,.panel,.citem,.srow,.orow,.addrcard,.setrow,.track,.stat{border-radius:20px;box-shadow:var(--sh-1)}
.pcard{border-radius:20px;box-shadow:var(--sh-1);transition:transform .35s var(--spring),box-shadow .3s}
.menu button{border-radius:16px;box-shadow:var(--sh-1);transition:transform .35s var(--spring),background .2s}
.radio-card,.social{border-radius:20px;transition:border-color .25s,background .25s,transform .35s var(--spring)}
.pcard:active,.srow:active,.orow:active,.menu button:active,.radio-card:active,.social:active,.sellerrow:active,.cat:active,.stat:active,.role-card:active{transform:scale(.97)}
.cat{border-radius:12px;transition:background .3s,color .3s,transform .35s var(--spring)}
.search{border-radius:14px}
.sheet{border-radius:28px 28px 0 0;animation:sheet .5s var(--spring)}
.overlay{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.processing{border-radius:24px}
.note{border-radius:14px}
.banner{border-radius:20px}
.art{border-radius:14px}
.toast{border-radius:14px}

/* logo tile */
.logo-tile{display:block;overflow:hidden;border-radius:28%;box-shadow:0 6px 16px rgba(0,96,253,.22);flex:none}
.logo-tile img{display:block;width:100%;height:100%}
.brand .logo-tile{width:32px;height:32px;border-radius:10px}
.mini-logo .logo-tile{width:64px;height:64px;border-radius:19px}

/* shared motion utilities */
@keyframes aDrop{from{opacity:0;transform:translateY(-22px) scale(.96)}to{opacity:1;transform:none}}
@keyframes aRise{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
@keyframes aPop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes aFadeIn{to{opacity:1}}
@keyframes aFadeOut{to{opacity:0}}
@keyframes aFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.a-drop{animation:aDrop .7s var(--spring) var(--d,0s) both}
.a-rise{animation:aRise .75s var(--spring) var(--d,0s) both}
.a-pop{animation:aPop .55s var(--spring) var(--d,0s) both}
.a-fade{animation:aFadeUp .6s var(--ease) var(--d,0s) both}
.stagger > *{animation:aRise .6s var(--spring) both}
.stagger > *:nth-child(1){animation-delay:.06s}.stagger > *:nth-child(2){animation-delay:.11s}.stagger > *:nth-child(3){animation-delay:.16s}
.stagger > *:nth-child(4){animation-delay:.21s}.stagger > *:nth-child(5){animation-delay:.26s}.stagger > *:nth-child(6){animation-delay:.31s}
.stagger > *:nth-child(7){animation-delay:.36s}.stagger > *:nth-child(8){animation-delay:.41s}.stagger > *:nth-child(n+9){animation-delay:.46s}
.screen.still .stagger > *,.screen.still .a-fade,.screen.still .a-rise,.screen.still .a-pop,.screen.still .sw-bar i.now::after,.screen.still .sh-badges span,.screen.still .map .pin{animation:none!important}

/* ---------- Splash ---------- */
.splash{position:absolute;inset:0;background:var(--brand);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.splash::before{content:"";position:absolute;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),rgba(255,255,255,0) 60%);opacity:0;animation:aFadeIn 1.2s ease .2s forwards}
.sp-mark{width:min(40vw,156px);aspect-ratio:1;position:relative;border-radius:28%;overflow:hidden;box-shadow:0 0 0 1.5px rgba(255,255,255,.22),0 24px 50px rgba(0,30,110,.35);animation:spIn 1.05s var(--spring) both}
.sp-mark img{width:100%;height:100%;display:block}
.sp-word{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:22px;position:relative;animation:aFadeUp .7s var(--ease) .7s both}
.sp-ring{position:absolute;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.35);opacity:0;animation:spRing 1.9s var(--ease) .45s forwards}
.sp-ring.r2{animation-delay:.85s}
@keyframes spIn{0%{opacity:0;transform:scale(.35) translateY(30px);filter:blur(8px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
@keyframes spRing{0%{opacity:0;transform:scale(.6)}25%{opacity:1}100%{opacity:0;transform:scale(2.6)}}
.splash.out .sp-mark{animation:spOut .5s var(--ease) forwards}
.splash.out .sp-word{animation:aFadeOut .25s ease forwards}
@keyframes spOut{to{opacity:0;transform:scale(.75) translateY(-50px)}}

/* ---------- Intro (three animated slides) ---------- */
.intro2{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;transition:background-color .7s var(--ease),color .5s ease;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.i-glow{position:absolute;left:50%;top:32%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),rgba(255,255,255,0) 62%);pointer-events:none;transition:opacity .6s}
.i-stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 6px}
.i-stage{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.i-stage .slot{grid-area:1/1;display:block;width:100%;height:100%;min-height:0;min-width:0;position:relative}
.slot.leave{animation:slotOut .45s var(--ease) forwards;pointer-events:none}
.slot.leave.rev{animation-name:slotOutRev}
@keyframes slotOut{to{opacity:0;transform:translateX(-70px) scale(.94)}}
@keyframes slotOutRev{to{opacity:0;transform:translateX(70px) scale(.94)}}
.mock-fit{transform-origin:0 0;position:absolute;left:0;top:0;width:max-content}
.i-copy{padding:6px max(24px,env(safe-area-inset-left,0px)) 0;min-height:132px}
.i-copy h1{margin:0 0 10px;font-size:28px;line-height:1.15;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.i-copy p{margin:0;font-size:15px;line-height:1.55;opacity:.78;max-width:360px}
.i-copy.swap h1{animation:aFadeUp .6s var(--ease) both}
.i-copy.swap p{animation:aFadeUp .6s var(--ease) .08s both}
.i-nav{display:flex;align-items:center;justify-content:space-between;padding:18px max(24px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.i-skip{font-weight:600;font-size:15px;padding:12px 4px;transition:opacity .3s}
.i-dots{display:flex;gap:6px;transition:opacity .3s}
.i-dots i{width:7px;height:7px;border-radius:99px;background:currentColor;opacity:.35;transition:width .5s var(--spring),opacity .3s}
.i-dots i.on{width:24px;opacity:1}
.i-next{height:56px;width:56px;border-radius:28px;display:grid;place-items:center;font-weight:600;font-size:15.5px;overflow:hidden;white-space:nowrap;box-shadow:0 10px 24px rgba(0,0,0,.18);transition:width .55s var(--spring),border-radius .5s var(--ease),background-color .6s var(--ease),color .5s,transform .3s var(--spring)}
.i-next:active{transform:scale(.93)}
.i-next svg{width:22px;height:22px;grid-area:1/1;transition:opacity .25s,transform .4s var(--spring)}
.i-next span{grid-area:1/1;opacity:0;transition:opacity .3s .15s}
.i-next.wide{width:152px;border-radius:16px}
.i-next.wide svg{opacity:0;transform:translateX(20px)}
.i-next.wide span{opacity:1}
.intro2.last .i-skip,.intro2.last .i-dots{opacity:0;pointer-events:none}

/* mock-ups inside the slides */
.mock{position:relative;width:320px;display:flex;flex-direction:column;gap:14px}
.m1{padding-bottom:86px}.m2{padding-bottom:54px}
.m-card{background:#fff;color:#0F1729;border-radius:22px;padding:16px;box-shadow:0 20px 50px rgba(3,20,60,.28);display:flex;flex-direction:column;gap:12px;position:relative}
.m-search{display:flex;align-items:center;gap:8px;background:#fff;color:#0F1729;border-radius:99px;padding:8px 8px 8px 16px;font-size:13px;box-shadow:0 10px 30px rgba(3,20,60,.22)}
.m-search > svg{width:16px;height:16px;color:#6B7280}
.m-search b{font-weight:600;color:#0060FD;margin-left:auto}
.m-filter{width:28px;height:28px;border-radius:50%;background:#0060FD;display:grid;place-items:center}
.m-filter svg{width:14px;height:14px;color:#fff}
.m-store{display:flex;align-items:center;gap:12px}
.m-av{width:44px;height:44px;border-radius:14px;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;flex:none}
.m-av.sm{width:26px;height:26px;border-radius:9px;font-size:10px}
.m-sn b{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:600}
.m-vb{display:inline-grid;color:#0060FD}.m-vb svg{width:17px;height:17px}
.m-sn small{display:flex;align-items:center;gap:3px;color:#6B7280;font-size:12px;margin-top:3px}
.m-sn small svg{width:12px;height:12px}
.m-rate{display:flex;align-items:center;gap:2px;font-size:12px;color:#6B7280}
.m-rate > span{margin-left:6px}
.m-star{display:inline-grid;color:#DCE1EA;animation:mStar .45s var(--spring) var(--d) both}
.m-star svg{width:14px;height:14px}
@keyframes mStar{0%{color:#DCE1EA;transform:scale(1)}50%{transform:scale(1.35)}100%{color:#F59E0B;transform:scale(1)}}
.m-tags{display:flex;flex-wrap:wrap;gap:6px}
.m-tags span{display:inline-flex;align-items:center;gap:4px;background:#E9F8EF;color:#15803D;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:99px}
.m-tags svg{width:12px;height:12px}
.m-foot{display:flex;align-items:center;gap:10px;border-top:1px solid #EEF1F6;padding-top:12px}
.m-thumb{width:42px!important;aspect-ratio:1!important;border-radius:10px!important;flex:none}
.m-foot small{display:block;color:#6B7280;font-size:12px}
.m-foot b{font-size:15px}
.m-escrow{margin-left:auto;display:inline-flex;align-items:center;gap:4px;background:#E9F8EF;color:#15803D;font-size:11.5px;font-weight:600;padding:6px 9px;border-radius:9px}
.m-escrow svg{width:13px;height:13px;color:#22C55E}
.m-float{position:absolute;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0F1729;font-size:12px;font-weight:600;padding:7px 12px 7px 7px;border-radius:99px;box-shadow:0 12px 28px rgba(3,20,60,.25);white-space:nowrap;animation:aPop .6s var(--spring) var(--d) both,floaty 4.5s ease-in-out calc(var(--d) + .7s) infinite}
.m-float i{display:inline-grid;color:#0060FD}.m-float i svg{width:15px;height:15px}
.m-float .m-ic{width:26px;height:26px;border-radius:50%;background:#FEF5DF;color:#B45309;display:grid;place-items:center}
.m-float .m-ic svg{width:14px;height:14px}
.m-float b{color:#15803D}
.f1{left:-10px;bottom:38px}.f2{right:-8px;bottom:0}.f3{right:-6px;bottom:0}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.m-head > b{font-size:15px}
.m-head small{display:block;color:#6B7280;font-size:11.5px}
.m-head div b{font-size:14px;letter-spacing:.02em}
.m-secure{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;font-weight:600;color:#15803D;background:#E9F8EF;padding:5px 8px;border-radius:8px}
.m-secure svg{width:12px;height:12px}
.m-item{display:flex;align-items:center;gap:10px;padding:10px;background:#F5F7FB;border-radius:14px;font-size:13.5px}
.m-item > div:not(.art){flex:1;min-width:0}
.m-item b{white-space:nowrap}
.m-item small{display:flex;align-items:center;gap:3px;color:#6B7280;font-size:12px}
.m-item small svg{width:12px;height:12px;color:#0060FD}
.m-line{display:flex;justify-content:space-between;font-size:13px;color:#6B7280}
.m-line.tot{color:#0F1729;font-size:15px}
.m-pay{position:relative;height:50px;border-radius:14px;background:#0060FD;color:#fff;display:grid;place-items:center;font-weight:600;font-size:14.5px;animation:mPress .35s ease 1.3s both}
.m-pay-g{position:absolute;inset:0;border-radius:inherit;background:#22C55E;opacity:0;animation:aFadeIn .4s ease 1.5s forwards}
.m-pay-a,.m-pay-b{grid-area:1/1;position:relative;display:inline-flex;align-items:center;gap:6px}
.m-pay-a{animation:aFadeOut .25s ease 1.45s forwards}
.m-pay-b{opacity:0;animation:aFadeUp .45s var(--spring) 1.6s forwards}
.m-pay-b svg{width:16px;height:16px}
.m-tap{position:absolute;left:64%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:rgba(255,255,255,.6);opacity:0;animation:mTap .6s ease-out 1.15s both}
.m-pay .confetti{top:50%}
@keyframes mPress{0%,100%{transform:scale(1)}40%{transform:scale(.95)}}
@keyframes mTap{0%{opacity:0;transform:scale(.3)}30%{opacity:1}100%{opacity:0;transform:scale(2.6)}}
.m-hint{display:flex;gap:6px;align-items:center;justify-content:center;font-size:12px;color:#6B7280}
.m-hint svg{width:14px;height:14px;color:#22C55E}
.m-paid{align-self:center;display:inline-flex;align-items:center;gap:6px;background:#22C55E;color:#fff;font-weight:600;font-size:13px;padding:8px 14px;border-radius:99px;box-shadow:0 10px 24px rgba(34,197,94,.35);margin-bottom:-4px;position:relative;z-index:2}
.m-paid svg{width:15px;height:15px}
.m-st{display:grid}
.m-st span{grid-area:1/1;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:9px;justify-self:end}
.m-st svg{width:12px;height:12px}
.m-st .s1{background:#FEF5DF;color:#B45309;animation:aFadeOut .3s ease 2.2s forwards}
.m-st .s2{background:#E9F8EF;color:#15803D;opacity:0;animation:aPop .5s var(--spring) 2.3s forwards}
.m-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.m-steps li{display:flex;gap:12px;align-items:flex-start;position:relative;opacity:.4;animation:aFadeIn .4s ease var(--d) forwards}
.m-steps li:not(:last-child)::after,.m-steps li:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;height:calc(100% - 12px);width:2px;background:#E7EBF2}
.m-steps li:not(:last-child)::before{background:#22C55E;transform:scaleY(0);transform-origin:top;animation:aGrow .4s ease calc(var(--d) + .2s) forwards;z-index:1}
@keyframes aGrow{to{transform:scaleY(1)}}
.m-ck{width:24px;height:24px;border-radius:50%;background:#EEF1F6;color:transparent;display:grid;place-items:center;flex:none;animation:mCk .45s var(--spring) var(--d) forwards}
.m-ck svg{width:13px;height:13px}
@keyframes mCk{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1);background:#22C55E;color:#fff}}
.m-steps b{display:block;font-size:13.5px;font-weight:600}
.m-steps small{font-size:12px;color:#6B7280}
.m-review{background:#0F1729;color:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 18px 40px rgba(15,23,41,.25)}
.m-review p{margin:6px 0 4px;font-size:13.5px;line-height:1.4}
.m-review small{opacity:.65;font-size:12px}
.m-rs{display:flex;gap:2px}

/* ---------- Role picker ---------- */
.role{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.role-top{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:14px}
.role-top .logo-tile{width:36px;height:36px;border-radius:11px}
.role h1{margin:0;font-size:28px;letter-spacing:-.02em;font-weight:700}
.brandtxt{color:var(--blue)}
.role-sub{margin:-6px 0 4px;color:var(--muted);font-size:15px}
.role-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:16px;transition:border-color .3s,background .3s,transform .35s var(--spring),box-shadow .3s}
.role-card.on{border-color:var(--blue);background:#F5F9FF;box-shadow:0 10px 26px rgba(0,96,253,.12)}
.rc-ic{width:46px;height:46px;border-radius:14px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;flex:none;transition:background .3s,color .3s,transform .45s var(--spring)}
.rc-ic svg{width:24px;height:24px}
.role-card.on .rc-ic{background:var(--blue);color:#fff;transform:rotate(-6deg) scale(1.05)}
.rc-t{flex:1}
.rc-t b{display:block;font-size:16px;font-weight:600}
.rc-t span{font-size:13.5px;color:var(--muted);line-height:1.4}
.rc-radio{width:22px;height:22px;border-radius:50%;border:1.5px solid #C5CCD8;display:grid;place-items:center;flex:none;transition:border-color .3s}
.rc-radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--blue);transform:scale(0);transition:transform .4s var(--spring)}
.role-card.on .rc-radio{border-color:var(--blue)}
.role-card.on .rc-radio::after{transform:scale(1)}
.role-login{display:block;margin:0 auto;color:var(--blue);font-weight:600;font-size:14.5px;padding:10px}
.why{background:#EAF8F0;border-radius:22px;padding:18px 18px 16px;margin-top:4px}
.why h3{margin:0 0 8px;color:#15803D;font-size:18px}
.why p{margin:0 0 14px;color:#3C4A40;font-size:14px;line-height:1.55}
.why-tags{display:flex;flex-wrap:wrap;gap:16px}
.why-tags span{display:inline-flex;align-items:center;gap:6px;color:#15803D;font-weight:600;font-size:13.5px}
.why-tags svg{width:18px;height:18px;padding:2px;border:1.5px solid #22C55E;border-radius:50%}

/* ---------- Seller wizard ---------- */
.sw-top{margin-bottom:6px}
.sw-prog{display:flex;flex-direction:column;gap:7px;padding:0 6px}
.sw-prog span{font-size:12.5px;font-weight:600;color:var(--blue);text-align:center}
.sw-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.sw-bar i{height:5px;border-radius:9px;background:#DFE6F2;overflow:hidden;position:relative}
.sw-bar i.done{background:var(--blue)}
.sw-bar i.now::after{content:"";position:absolute;inset:0;background:var(--blue);transform-origin:left;animation:barGrow .7s var(--ease) .15s both}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sw-head{margin:12px 0 22px}
.sw-head h1{margin:0 0 6px;font-size:25px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.sw-head p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
.hint{font-size:12.5px;color:var(--muted);margin:-8px 0 0;line-height:1.45}
.opt{font-weight:400;color:var(--muted);font-size:13px}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline}
.lbl-row small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .3s,border-color .3s,color .3s,transform .35s var(--spring)}
.chip svg{width:15px;height:15px;display:none}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.on svg{display:block}
.chip:active{transform:scale(.94)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#E8EDF5;border-radius:14px;padding:4px;position:relative}
.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:#fff;border-radius:11px;box-shadow:0 2px 8px rgba(16,24,40,.08);transition:transform .45s var(--spring)}
.seg.r::before{transform:translateX(100%)}
.seg button{height:42px;border-radius:11px;font-size:14px;font-weight:600;color:var(--muted);position:relative;z-index:1;transition:color .3s}
.seg button.on{color:var(--ink)}
.linkchip{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.linkchip b{color:var(--blue);font-weight:600}
.linkchip .ok{color:var(--green-ink);display:inline-flex;align-items:center;gap:3px;font-weight:600}
.linkchip svg{width:14px;height:14px}
.pref{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px;pointer-events:none}
.input.has-pref input{padding-left:var(--pl,58px)}
.pw-meter{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:-12px}
.pw-meter i{height:4px;border-radius:9px;background:#E3E8F0;transition:background .3s}
.pw-meter.s1 i:nth-child(1){background:#EF4444}
.pw-meter.s2 i:nth-child(-n+2){background:#F59E0B}
.pw-meter.s3 i:nth-child(-n+3){background:#84CC16}
.pw-meter.s4 i{background:#22C55E}
.check.terms{align-items:flex-start;font-size:13.5px;line-height:1.45;color:var(--muted);gap:10px}
.check.terms .box{flex:none;margin-top:1px}
.upl{display:flex;align-items:center;gap:14px;background:#fff;border:1.5px dashed #C9D3E3;border-radius:18px;padding:14px;cursor:pointer;transition:border-color .25s,background .25s}
.upl:hover{border-color:var(--blue)}
.upl .ui{width:48px;height:48px;border-radius:14px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;flex:none;overflow:hidden}
.upl .ui svg{width:22px;height:22px}
.upl .ui img{width:100%;height:100%;object-fit:cover}
.upl .ut{flex:1;min-width:0}
.upl .ut b{display:block;font-size:14.5px;font-weight:600}
.upl .ut span{font-size:12.5px;color:var(--muted);line-height:1.35}
.upl .st{font-size:12.5px;font-weight:600;color:var(--blue);display:grid}
.upl .st svg{width:22px;height:22px}
.upl.done{border-style:solid;border-color:#BFE8CF;background:#F3FBF6}
.upl.done .st{color:var(--green)}
.logo-up{width:88px;height:88px;border-radius:26px;margin:0 auto;background:linear-gradient(135deg,#2F7BFF,#0047C2);color:#fff;display:grid;place-items:center;cursor:pointer;overflow:hidden;position:relative;box-shadow:0 10px 24px rgba(0,96,253,.25)}
.logo-up img{width:100%;height:100%;object-fit:cover}
.logo-up .ini{font-size:28px;font-weight:700}
.logo-up small{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;box-shadow:var(--sh-1)}
.logo-up small svg{width:16px;height:16px}
.logo-up-wrap{position:relative;width:88px;margin:0 auto}
.logo-up-wrap .cam{position:absolute;right:-6px;bottom:-6px;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;box-shadow:var(--sh-2);pointer-events:none}
.logo-up-wrap .cam svg{width:17px;height:17px}
.map{position:relative;height:160px;border-radius:20px;overflow:hidden;background:#E6EDF7}
.map svg.mp{position:absolute;inset:0;width:100%;height:100%}
.map .pin{position:absolute;left:50%;top:42%;transform:translate(-50%,-100%);color:var(--blue);animation:pinDrop .8s var(--spring) .3s both}
.map .pin svg{width:40px;height:40px;filter:drop-shadow(0 6px 8px rgba(0,60,180,.3))}
.map .pulse{position:absolute;left:50%;top:42%;width:16px;height:16px;margin:-8px;border-radius:50%;background:rgba(0,96,253,.3);animation:pulse2 2s ease-out 1s infinite}
@keyframes pinDrop{from{opacity:0;transform:translate(-50%,-190%)}to{opacity:1;transform:translate(-50%,-100%)}}
@keyframes pulse2{0%{transform:scale(.5);opacity:1}100%{transform:scale(4);opacity:0}}
.map .lbl{position:absolute;left:12px;right:12px;bottom:12px;background:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh-1)}
.map .lbl b{display:block;font-size:14px}
.map .lbl span{color:var(--muted);font-size:12px}
.map .lbl svg{width:20px;height:20px;color:var(--green);flex:none}
.selfie{display:flex;align-items:center;gap:16px;background:#fff;border-radius:20px;padding:16px;border:1.5px solid var(--line);cursor:pointer;transition:border-color .25s}
.selfie .ring{width:76px;height:76px;border-radius:50%;border:2.5px dashed #B9C6DA;display:grid;place-items:center;color:var(--blue);flex:none;overflow:hidden}
.selfie .ring svg{width:36px;height:36px}
.selfie .ring img{width:100%;height:100%;object-fit:cover}
.selfie.done{border-color:#BFE8CF;background:#F3FBF6}
.selfie.done .ring{border:3px solid var(--green)}
.selfie .tx b{display:block;font-size:15px}
.selfie .tx span{font-size:13px;color:var(--muted);line-height:1.4}
.acct-res{display:flex;align-items:center;gap:12px;border-radius:16px;padding:14px;background:#F3FBF6;border:1px solid #BFE8CF;animation:aRise .5s var(--spring) both}
.acct-res .av{width:40px;height:40px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.acct-res .av svg{width:20px;height:20px}
.acct-res b{display:block;font-size:15px;letter-spacing:.02em}
.acct-res span{font-size:12.5px;color:var(--green-ink)}
.acct-res.loading{background:#fff;border-color:var(--line)}
.acct-res.loading .av{background:var(--blue-50)}
.acct-res.loading span{color:var(--muted)}
.mini-spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--blue-100);border-top-color:var(--blue);animation:spin2 .7s linear infinite}
.btn > svg:last-child:not(:first-child){width:20px;height:20px}

/* review */
.rv{background:#fff;border-radius:20px;padding:14px 18px;box-shadow:var(--sh-1)}
.rv-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rv-h b{font-size:15.5px}
.rv-r{display:flex;justify-content:space-between;gap:16px;padding:6px 0;font-size:13.5px}
.rv-r span{color:var(--muted);flex:none}
.rv-r b{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.rv-preview > small{display:block;font-size:11.5px;color:var(--muted);margin:0 0 8px 4px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}

/* verification check */
.vc-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin:14px 0 22px}
.vc-head h1{margin:6px 0 0;font-size:23px;font-weight:700}
.vc-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;max-width:320px}
.vc-ring{width:92px;height:92px;position:relative;display:grid;place-items:center}
.vc-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.vc-ring circle{fill:none;stroke-width:8}
.vc-ring .bg{stroke:#E3EAF5}
.vc-ring .fg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:239;stroke-dashoffset:239;transition:stroke-dashoffset .7s var(--ease),stroke .4s}
.vc-n{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.vc-list{background:#fff;border-radius:24px;padding:4px 16px;box-shadow:var(--sh-1)}
.vc-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #EEF1F6;opacity:.55;transition:opacity .4s}
.vc-row:last-child{border:0}
.vc-row.run,.vc-row.ok,.vc-row.wait{opacity:1}
.vc-ic{width:40px;height:40px;border-radius:12px;background:#F1F4F9;color:var(--muted);display:grid;place-items:center;flex:none;transition:background .4s,color .4s}
.vc-ic svg{width:20px;height:20px}
.vc-row.ok .vc-ic{background:var(--green-50);color:var(--green)}
.vc-row.run .vc-ic,.vc-row.wait .vc-ic{background:var(--blue-50);color:var(--blue)}
.vc-row > div{flex:1;min-width:0}
.vc-row b{display:block;font-size:14.5px;font-weight:600}
.vc-row > div span{font-size:12.5px;color:var(--muted)}
.vc-st{display:grid;place-items:center;min-width:28px}
.vc-st > *{grid-area:1/1;display:none}
.vc-st .q{font-size:12px;color:var(--faint)}
.vc-row:not(.run):not(.ok):not(.wait) .q{display:block}
.vc-st .vc-spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--blue-100);border-top-color:var(--blue);animation:spin2 .7s linear infinite;transform-origin:center}
.vc-row.run:not(.ok) .vc-spin{display:block}
.vc-st .ok{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;place-items:center;animation:aPop .5s var(--spring) both}
.vc-st .ok svg{width:14px;height:14px}
.vc-row.ok .ok{display:grid}
.vc-st .wait{font-size:11.5px;font-weight:600;color:var(--amber-ink);background:var(--amber-50);padding:5px 8px;border-radius:8px;white-space:nowrap}
.vc-row.wait:not(.ok) .wait{display:block}

/* store header + trust page */
.sh{background:#fff;border-radius:24px;overflow:hidden;box-shadow:var(--sh-1)}
.sh-cover{height:84px;background-color:var(--c);background-image:radial-gradient(circle at 18% 10%,rgba(255,255,255,.38),rgba(255,255,255,0) 45%),radial-gradient(circle at 92% 130%,rgba(0,0,0,.2),rgba(0,0,0,0) 55%);position:relative;overflow:hidden}
.sh-cover::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.25) 1.2px,transparent 1.4px);background-size:14px 14px}
.sh-body{padding:0 18px 18px;margin-top:-32px;position:relative}
.sh-logo{width:64px;height:64px;border-radius:20px;border:4px solid #fff;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;overflow:hidden;box-shadow:0 8px 20px rgba(16,24,40,.15)}
.sh-logo img{width:100%;height:100%;object-fit:cover}
.sh-name{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.sh-name > b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.vb{display:inline-grid;color:var(--blue)}.vb svg{width:20px;height:20px}
.sh-meta{display:flex;align-items:flex-start;gap:5px;color:var(--muted);font-size:13px;line-height:1.4;margin-top:4px}
.sh-meta span{min-width:0}
.sh-meta svg{width:14px;height:14px;flex:none;margin-top:2px}
.sh-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sh-badges span{display:inline-flex;align-items:center;gap:4px;background:var(--green-50);color:var(--green-ink);font-size:12px;font-weight:600;padding:5px 9px;border-radius:99px;animation:aPop .5s var(--spring) var(--d,0s) both}
.sh-badges span.pend{background:var(--amber-50);color:var(--amber-ink)}
.sh-badges svg{width:12px;height:12px}
.sp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.sp-stats div{background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--sh-1)}
.sp-stats b{display:flex;align-items:center;justify-content:center;gap:4px;font-size:16px;font-weight:700}
.sp-stats b svg{width:15px;height:15px;color:var(--amber)}
.sp-stats span{font-size:12px;color:var(--muted)}
.trust{background:#fff;border-radius:24px;padding:18px;box-shadow:var(--sh-1)}
.trust h3{margin:0 0 4px;display:flex;align-items:center;gap:8px;font-size:16px}
.trust h3 svg{width:20px;height:20px;color:var(--green)}
.tr{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #EEF1F6;animation:aFadeUp .5s var(--ease) var(--d) both}
.tr:last-of-type{border-bottom:0}
.tr-ic{width:38px;height:38px;border-radius:12px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;flex:none}
.tr-ic svg{width:19px;height:19px}
.tr > div{flex:1;min-width:0}
.tr b{display:block;font-size:14.5px;font-weight:600}
.tr > div span{font-size:12.5px;color:var(--muted);line-height:1.4}
.tr-ck{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;animation:aPop .5s var(--spring) calc(var(--d) + .25s) both}
.tr-ck svg{width:13px;height:13px}
.tr.neu .tr-ck{background:#EEF1F6;color:var(--muted)}
.tr.neu .tr-ic{background:#F1F3F7;color:var(--muted)}
.tr-foot{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.tr-foot .textlink{font-size:12.5px}
.infolist{background:#fff;border-radius:22px;padding:4px 16px;margin-top:14px;box-shadow:var(--sh-1)}
.infolist > div{display:flex;gap:12px;align-items:flex-start;padding:12px 0;font-size:13.5px;line-height:1.45;border-bottom:1px solid #EEF1F6}
.infolist > div:last-child{border:0}
.infolist svg{width:19px;height:19px;color:var(--blue);flex:none;margin-top:1px}
.revs{display:flex;flex-direction:column;gap:12px}
.rev{background:#fff;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh-1)}
.rev-h{display:flex;align-items:center;gap:10px}
.rev-av{width:36px;height:36px;border-radius:12px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.rev-h b{display:block;font-size:14px}.rev-h small{color:var(--muted);font-size:12px}
.rev-s{margin-left:auto;display:flex;gap:1px}
.rev-s svg{width:13px;height:13px}
.rev p{margin:0;font-size:14px;line-height:1.5}
.st-av,.sellerrow .st-av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.sellerrow{width:100%;text-align:left;transition:transform .35s var(--spring)}
.sellerrow .tx{flex:1;min-width:0}
.sellerrow .tx b{display:flex;align-items:center;gap:5px}
.sellerrow .tx b svg{width:16px;height:16px;color:var(--blue)}
.sellerrow .tx span{display:block;line-height:1.4}
.sellerrow .chev{width:18px;height:18px;color:var(--faint);flex:none}
button.verified{padding:0}
.verified svg:last-child{width:14px;height:14px;opacity:.6}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-delay:0s!important}}

let stack=[];
function go(name,opt={}){
  if(opt.replace) stack.pop();
  if(opt.reset) stack=[];
  stack.push(name); render(name,opt.dir||'fwd');
}
function back(){ if(stack.length>1){stack.pop(); render(stack[stack.length-1],'back');} }
function render(name,dir){
  closeOverlay();
  const prev=app.querySelector('.screen'); const keep=(dir==='none'&&prev&&prev.dataset.view===name)?prev.scrollTop:0;
  const html=V[name]();
  const el=document.createElement('section');
  el.className='screen'+(dir==='back'?' back-anim':dir==='fade'?' fade':dir==='none'?' still':'');
  if(['splash','intro'].includes(name)) el.classList.add('bare');
  el.innerHTML=html; el.dataset.view=name;
  app.querySelectorAll('.screen').forEach(s=>s.remove());
  app.prepend(el); if(keep) el.scrollTop=keep;
  const tm=document.querySelector('meta[name="theme-color"]'); if(tm) tm.content=['splash','intro'].includes(name)?'#0060FD':'#F4F6FA';
  if(el.classList.contains('hero')) mountPattern(el);
  (A[name]||(()=>{}))(el);
}

function tileSVG(alt){
  const s='rgba(255,255,255,'+(alt?'.16':'.085')+')';
  const g=(x,y,path,r=0)=>`<g transform="translate(${x} ${y}) rotate(${r} 12 12)" fill="none" stroke="${s}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${path}</g>`;
  const icons=alt
   ?[g(14,74,I.pkg,-10),g(84,18,I.search,8)]
   :[g(10,12,I.lock,-8),g(76,8,'<path d="M12 2.5l8 3v6.2c0 4.7-3.3 8.4-8 9.8-4.7-1.4-8-5.1-8-9.8V5.5z"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/>',6),g(44,62,'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>',0),g(94,80,'<path d="M12 2l2.4 2.1 3.2-.4.7 3.1 2.8 1.6-1.2 3 1.2 3-2.8 1.6-.7 3.1-3.2-.4L12 22l-2.4-2.1-3.2.4-.7-3.1-2.8-1.6 1.2-3-1.2-3 2.8-1.6.7-3.1 3.2.4z"/><path d="M8.7 12.2l2.2 2.2 4.4-4.6"/>',12)];
  return `<svg xmlns="http://www.w3.org/2000/svg" width="130" height="130" viewBox="0 0 130 130">${icons.join('')}</svg>`;
}
const TILE_A='url("data:image/svg+xml;utf8,'+encodeURIComponent(tileSVG(false))+'")';
const TILE_B='url("data:image/svg+xml;utf8,'+encodeURIComponent(tileSVG(true))+'")';
function mountPattern(el){
  const a=document.createElement('div');a.className='pattern';a.style.backgroundImage=TILE_A;
  const b=document.createElement('div');b.className='pattern b';b.style.backgroundImage=TILE_B;
  const glow=document.createElement('div');glow.className='hero-glow';
  const sw=document.createElement('div');sw.className='sweep';
  el.prepend(sw,glow,b,a);
  el.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    a.style.transform=`translate(${x*-14}px,${y*-14}px)`; b.style.transform=`translate(${x*-26}px,${y*-26}px)`;

  });
}

const SWV={
 1:()=>{const s=S.sel; if(s.name.trim().split(/\s+/).length<2) return 'Enter your first and last name as they appear on your ID.'; if(s.phone.replace(/\D/g,'').replace(/^0/,'').length!==10) return 'Enter a valid Nigerian phone number.'; if(!/^\S+@\S+\.\S+$/.test(s.email.trim())) return 'Enter a valid email address.'; if(s.pw.length<8) return 'Use at least 8 characters for your password.'; if(!s.agree) return 'Accept the Seller Terms to continue.';},
 2:()=>{const s=S.sel; if(s.store.trim().length<3) return 'Give your store a name of at least 3 characters.'; if(!s.cats.length) return 'Pick at least one thing you sell.'; if(s.desc.trim().length<20) return 'Add a short description of at least 20 characters.';},
 3:()=>{const s=S.sel; if(s.btype==='registered'){ if(!s.bizname.trim()) return 'Enter your business name as registered with CAC.'; if(!/^(RC|BN|IT)\s?\d{5,8}$/i.test(s.cac.trim())) return 'CAC numbers look like RC 1234567 or BN 1234567.'; if(!s.cacDoc) return 'Upload your CAC certificate.';} if(!s.years) return 'Tell buyers how long you have been selling.';},
 4:()=>{const s=S.sel; if(!s.street.trim()||!s.area.trim()||!s.city.trim()) return 'Add your address, area and city.'; if(!s.poa) return 'Upload a proof of address.';},
 5:()=>{const s=S.sel,d=s.idNum.replace(/\s/g,''); if(s.idType==='NIN'?!/^\d{11}$/.test(d):d.length<6) return s.idType==='NIN'?'Your NIN has 11 digits.':'Enter the number on your ID.'; if(!s.idDoc) return 'Upload a photo of your ID.'; if(!s.selfie) return 'Take a selfie so we can match it to your ID.';},
 6:()=>{const s=S.sel; if(!/^\d{10}$/.test(s.acct)) return 'Account numbers have 10 digits.'; if(!s.acctName) return 'Wait a moment while we confirm the account name.';}
};
function swA(el,n){
  const view='sw'+n;
  el.querySelectorAll('input[data-up]').forEach(inp=>inp.addEventListener('change',e=>{const f=e.target.files[0]; if(!f) return; const k=inp.dataset.up; const fin=src=>{saveSW(el); S.sel[k]=src; render(view,'none'); toast('Uploaded');}; if(f.type.startsWith('image/')) readImg(f,fin); else fin(sampleDoc(f.name.slice(0,30),'Uploaded document','#4B5563'));}));
  el.addEventListener('click',e=>{
    const m=e.target.closest('[data-many]'); if(m){const k=m.dataset.many,v=m.dataset.v,a=S.sel[k],i=a.indexOf(v); if(i<0)a.push(v); else a.splice(i,1); m.classList.toggle('on',i<0); return;}
    const o=e.target.closest('[data-one]'); if(o){const k=o.dataset.one; o.parentElement.querySelectorAll('[data-one]').forEach(x=>x.classList.toggle('on',x===o)); if(k==='idType'){saveSW(el); S.sel[k]=o.dataset.v; render(view,'none');} else S.sel[k]=o.dataset.v; return;}
    const s=e.target.closest('.seg button'); if(s){const seg=s.parentElement; if(s.classList.contains('on')) return; saveSW(el); S.sel[seg.dataset.seg]=s.dataset.v; seg.classList.toggle('r',s===seg.lastElementChild); seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===s)); setTimeout(()=>{ if(el.isConnected) render(view,'none'); },280);}
  });
  form(el,'#f-sw',()=>{ saveSW(el); const msg=SWV[n](); if(msg) return err('sw-err',msg);
    if(n===1){S.user.name=S.sel.name.trim(); S.user.first=S.user.name.split(' ')[0]; S.user.email=S.sel.email.trim();}
    if(S.swReturn){S.swReturn=false; back(); return;}
    go(n<6?'sw'+(n+1):'sreview'); });
}
function sampleSelfie(){const c=document.createElement('canvas');c.width=c.height=400;const x=c.getContext('2d');const g=x.createLinearGradient(0,0,0,400);g.addColorStop(0,'#DCE7F7');g.addColorStop(1,'#B9CBE6');x.fillStyle=g;x.fillRect(0,0,400,400);
  x.fillStyle='#2E3A59';x.beginPath();x.ellipse(200,430,150,120,0,0,7);x.fill();
  x.fillStyle='#7A4B2E';x.beginPath();x.ellipse(200,195,82,100,0,0,7);x.fill();
  x.fillStyle='#1B1B1F';x.beginPath();x.ellipse(200,128,90,52,0,Math.PI,0);x.fill();
  [170,230].forEach(cx=>{x.beginPath();x.arc(cx,195,7,0,7);x.fill();});
  x.strokeStyle='#3A2216';x.lineWidth=5;x.lineCap='round';x.beginPath();x.arc(200,228,26,.2*Math.PI,.8*Math.PI);x.stroke();
  return c.toDataURL('image/jpeg',.85);}
function sampleDoc(title,sub,col='#0B6E4F'){const c=document.createElement('canvas');c.width=600;c.height=420;const x=c.getContext('2d');x.fillStyle='#F7F4EC';x.fillRect(0,0,600,420);x.fillStyle=col;x.fillRect(0,0,600,72);x.fillStyle='#fff';x.font='bold 24px Inter, sans-serif';x.fillText(title,28,46);x.fillStyle='#4B5563';x.font='17px Inter, sans-serif';x.fillText(sub,28,112);
  [[28,152,520],[28,187,470],[28,222,500],[28,257,380],[28,292,440]].forEach(([a,b,w])=>{x.fillStyle='#DCD6C8';x.fillRect(a,b,w,12);});
  x.strokeStyle=col;x.lineWidth=4;x.beginPath();x.arc(502,340,46,0,7);x.stroke();x.fillStyle='#F59E0B';x.font='bold 15px Inter, sans-serif';x.fillText('SAMPLE · PROTOTYPE',28,396);return c.toDataURL('image/jpeg',.82);}

track:()=>{
  const o=S.order; const st=STAGE[o.status];
  const steps=[['Money held by Agora',o.heldAt],['Dispatched by seller',o.dispAt||'Seller has 48 hours to dispatch'],['Delivered',o.delAt||'Estimated 2–5 business days'],['Released to the seller','After you confirm delivery']];
  const p=P(o.items[0].pid);
  return `${top('Track order')}
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px"><div><b style="font-size:20px">Order</b><div style="color:var(--muted);font-size:13.5px;margin-top:6px">${o.id}</div></div><b style="font-variant-numeric:tabular-nums">${N(o.total)}</b></div>
  <div class="track">
   <div class="oc-head"><div><small style="color:var(--muted)">Order</small><b style="font-size:14px">${o.id}</b></div>${statusPill(o.status)}</div>
   <div class="oc-item" style="margin-top:14px">${art(p,'art',null,'width:86px;aspect-ratio:1.2')}<div class="meta"><b>${p.short}</b><span>${p.seller}</span></div><span class="amt">${N(o.total)}</span></div>
   <div class="tl">${steps.map(([t,s],i)=>{const n=i+2;const cls=n<=st?'done':n===st+1?'now':'';return `<div class="st ${cls}"><span class="dot">${n<=st?ic('check'):''}</span><div><b>${t}</b><span>${s}</span></div></div>`}).join('')}</div>
  </div>
  <div class="spacer"></div>
  <div class="sticky-cta">
   ${o.status==='dispatched'?`<button class="btn" data-act="rider">${ic('phone')}Contact Rider</button>`:''}
   ${o.status==='held'?`<button class="demo" data-act="simdispatch">${ic('play')}Prototype: seller dispatches the order</button>`:''}
   ${o.status==='dispatched'?`<button class="demo" data-act="simdeliver">${ic('play')}Prototype: rider delivers the order</button>`:''}
   ${o.status==='delivered'?`<button class="btn" data-go="arrived">Confirm Delivery</button>`:''}
  </div>`;
},

  const map={All:()=>true,'In progress':o=>o.status==='progress','Completed':o=>o.status==='completed','Cancelled':o=>o.status==='cancelled'};
