sw2:()=>swShell(2,'Set up your store','This is the first thing buyers see. You can change it later.',`
  <div class="logo-up-wrap"><label class="logo-up" for="u-logo" aria-label="Add store logo">${S.sel.logo?`<img src="${S.sel.logo}" alt="Store logo">`:`<span class="ini" id="logo-ini">${initials(S.sel.store)}</span>`}</label><span class="cam">${ic('camera')}</span><input type="file" id="u-logo" data-up="logo" accept="image/*" class="vh"></div>
  <div class="field"><label for="s-store">Store name</label><div class="input"><input id="s-store" value="${esc(S.sel.store)}" placeholder="e.g. Kuye Gadgets" maxlength="40" autocomplete="organization"></div><span class="linkchip">agoramarket.ng/<b id="slug">${slug(S.sel.store)}</b><span class="ok">${ic('check')}Available</span></span></div>
  <div class="field"><label>What do you sell?</label><div class="chips">${['Electronics','Phones','Fashion','Bags','Beauty','Home','Food','Kids','Other'].map(c=>`<button type="button" class="chip ${S.sel.cats.includes(c)?'on':''}" data-many="cats" data-v="${c}">${ic('check')}${c}</button>`).join('')}</div></div>
  <div class="field"><div class="lbl-row"><label for="s-desc">Describe your store</label><small id="dcount">${(S.sel.desc||'').length}/160</small></div><div class="input"><textarea id="s-desc" maxlength="160" placeholder="What you sell, and why buyers can rely on you">${esc(S.sel.desc)}</textarea></div></div>`),

sw3:()=>{const reg=S.sel.btype==='registered';
  return swShell(3,'Business details','Registered businesses get a CAC badge on their store. Individuals can sell too.',`
  <div class="field"><label>How do you sell?</label><div class="seg ${reg?'r':''}" data-seg="btype"><button type="button" class="${reg?'':'on'}" data-v="individual">Individual</button><button type="button" class="${reg?'on':''}" data-v="registered">Registered business</button></div></div>
  ${reg?`${sf('bizname','Business name',{ph:'As registered with CAC'})}
  ${sf('cac','CAC registration number',{ph:'RC 1234567 or BN 1234567',attrs:'autocapitalize="characters"'})}
  ${upl('cacDoc','CAC certificate','Photo or PDF of your certificate','image/*,application/pdf')}
  <button type="button" class="demo" data-act="swsample3">${ic('play')}Prototype: use a sample certificate</button>`
  :`<div class="note blue">${ic('info')}<div><b>Selling as an individual</b><span>You can start once your ID and address are verified. Register with CAC later to add the badge.</span></div></div>`}
  <div class="field"><label>How long have you been selling?</label><div class="chips">${['Just starting','Under 1 year','1–3 years','3+ years'].map(c=>`<button type="button" class="chip ${S.sel.years===c?'on':''}" data-one="years" data-v="${c}">${ic('check')}${c}</button>`).join('')}</div></div>
  ${sf('ig','Instagram <span class="opt">(optional)</span>',{pref:'@',pl:'34px',ph:'yourstore'})}
  ${sf('web','Website or TikTok <span class="opt">(optional)</span>',{ph:'https://',attrs:'inputmode="url"'})}
  <p class="hint">Links to where buyers already know you make your store page more convincing.</p>`);},

sw4:()=>{const ph=S.sel.shop==='physical';
  return swShell(4,'Where are you based?','Buyers see your area, never your full address.',`
  <div class="field"><label>Where do you sell from?</label><div class="seg ${ph?'':'r'}" data-seg="shop"><button type="button" class="${ph?'on':''}" data-v="physical">Physical shop</button><button type="button" class="${ph?'':'on'}" data-v="online">Online or from home</button></div></div>
  ${sf('street',ph?'Shop address':'Address',{ph:'Building number and street',attrs:'autocomplete="street-address"'})}
  <div class="row2">${sf('area','Area',{ph:'e.g. Computer Village'})}${sf('city','City',{ph:'e.g. Ikeja'})}</div>
  <div class="field"><label for="s-state">State</label><div class="input"><select id="s-state">${STATES.map(s=>`<option ${S.sel.state===s?'selected':''}>${s}</option>`).join('')}</select><span class="trail">${ic('down')}</span></div></div>
  ${sf('landmark','Nearest landmark <span class="opt">(optional)</span>',{ph:'e.g. Opposite Zenith Bank'})}
  <div class="map">${MAPSVG}<span class="pulse"></span><span class="pin">${PINSVG}</span><div class="lbl">${ic('shield')}<div><b id="maplbl">${esc(S.sel.area||'Your area')}, ${esc(S.sel.city||'your city')}</b><span>This is all buyers see</span></div></div></div>
  ${upl('poa','Proof of address','Utility bill or tenancy agreement from the last 3 months','image/*,application/pdf')}
  <button type="button" class="demo" data-act="swsample4">${ic('play')}Prototype: use a sample utility bill</button>
  ${ph?upl('shopPhoto','Shop front photo <span class="opt">(optional)</span>','Helps buyers recognise your shop'):''}`);},

sw5:()=>{const nin=S.sel.idType==='NIN';
  return swShell(5,'Verify your identity','We match your ID to a selfie. Your documents are never shown to buyers.',`
  <div class="field"><label>ID type</label><div class="chips">${['NIN','International passport',"Driver's licence","Voter's card"].map(c=>`<button type="button" class="chip ${S.sel.idType===c?'on':''}" data-one="idType" data-v="${c}">${ic('check')}${c}</button>`).join('')}</div></div>
  ${sf('idNum',nin?'NIN (11 digits)':'ID number',{ph:nin?'00000000000':'Number on your ID',attrs:nin?'inputmode="numeric" maxlength="11" autocomplete="off"':'autocomplete="off"'})}
  ${upl('idDoc','Photo of your ID','Front side, with all four corners visible')}
  <label class="selfie ${S.sel.selfie?'done':''}" for="u-selfie"><span class="ring">${S.sel.selfie?`<img src="${S.sel.selfie}" alt="Your selfie">`:ic('face')}</span><span class="tx"><b>${S.sel.selfie?'Selfie added':'Take a selfie'}</b><span>${S.sel.selfie?"Looks good. We'll match it to your ID photo.":'Face the light. No glasses or hat.'}</span></span></label><input type="file" id="u-selfie" data-up="selfie" accept="image/*" capture="user" class="vh">
  <button type="button" class="demo" data-act="swsample5">${ic('play')}Prototype: use a sample ID and selfie</button>
  <div class="note green">${ic('lock')}<div><b>Kept private</b><span>Only Agora's verification team can see your documents.</span></div></div>`);},

sw6:()=>swShell(6,'Where should we pay you?','Payouts land here once buyers confirm delivery.',`
  <div class="field"><label for="s-bank">Bank</label><div class="input"><select id="s-bank">${BANKS.map(b=>`<option ${S.sel.bank===b?'selected':''}>${b}</option>`).join('')}</select><span class="trail">${ic('down')}</span></div></div>
  ${sf('acct','Account number',{ph:'10-digit account number',attrs:'inputmode="numeric" maxlength="10" autocomplete="off"'})}
  <div id="acctres">${S.sel.acctName&&S.sel.acct.length===10?acctRes(false):''}</div>
  <div class="note blue">${ic('info')}<div><b>The account name must match your ID</b><span>This stops anyone else from collecting your payouts.</span></div></div>
  <div class="note amber">${ic('shield')}<div><b>Agora will never ask for your PIN or OTP</b><span>Not by phone, WhatsApp or email.</span></div></div>`,'Review details'),

sreview:()=>{const s=S.sel,reg=s.btype==='registered';
  const sec=(step,title,rows)=>`<div class="rv"><div class="rv-h"><b>${title}</b><button type="button" class="textlink" data-goto="${step}">Edit</button></div>${rows.map(([k,v])=>`<div class="rv-r"><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
  return `${top('Review and submit')}
  <p class="a-fade" style="color:var(--muted);margin:-4px 0 18px;line-height:1.5">Check everything once. Wrong details slow down verification.</p>
  <div class="rv-preview a-rise" style="--d:.05s"><small>How buyers will see you</small>${storeHeader(myStore(),true)}</div>
  <div class="stagger list-gap" style="margin-top:16px">
   ${sec('sw2','Store',[['Name',esc(s.store)],['Link','agoramarket.ng/'+slug(s.store)],['Sells',esc(s.cats.join(', '))]])}
   ${sec('sw3','Business',[['Type',reg?'Registered business':'Individual seller'],...(reg?[['CAC number',esc(s.cac)],['Certificate','Uploaded']]:[]),['Selling for',esc(s.years)],['Instagram',s.ig?'@'+esc(s.ig):'Not added']])}
   ${sec('sw4','Address',[['Shown to buyers',esc(s.area)+', '+esc(s.city)],['Full address (private)',esc(s.street)+', '+esc(s.state)],['Proof of address','Uploaded']])}
   ${sec('sw5','Identity',[['ID',esc(s.idType)+' ending '+esc(String(s.idNum).slice(-3))],['ID photo','Uploaded'],['Selfie','Added']])}
   ${sec('sw6','Payout',[['Bank',esc(s.bank)],['Account','Ending '+esc(String(s.acct).slice(-4))],['Account name',esc(s.acctName||'')]])}
   <span class="check terms" data-act="tick" id="confirm" role="checkbox" aria-checked="false" tabindex="0"><span class="box">${ic('check')}</span><span>I confirm these details are true. False details lead to permanent removal from Agora.</span></span>
   <div class="err" id="rv-err"></div>
  </div>
  <div class="spacer"></div>
  <div class="sticky-cta"><button class="btn" data-act="swsubmit">Submit for verification</button></div>`;},

vcheck:()=>{const reg=S.sel.btype==='registered',done=S.verify==='done';
  const items=[['bank','Payout account','Account name matches your ID',.9,'ok'],['face','Selfie match','Your selfie matches your ID photo',1.8,'ok'],['id','ID document',esc(S.sel.idType)+' checked',2.7,'ok'],[reg?'building':'insta',reg?'CAC registration':'Online presence',reg?'Checking '+esc(S.sel.cac)+' with CAC':'Reviewing your social profile',3.4,done?'ok':'wait'],['pin','Shop address','Reviewing your proof of address',3.9,done?'ok':'wait']];
  return `<div class="vc-head">
    <div class="vc-ring a-pop"><svg viewBox="0 0 92 92" aria-hidden="true"><circle class="bg" cx="46" cy="46" r="38"/><circle class="fg" id="vcfg" cx="46" cy="46" r="38"/></svg><span class="vc-n" id="vcn">0/5</span></div>
    <h1 class="a-fade" style="--d:.08s">We're checking your store</h1>
    <p class="a-fade" style="--d:.12s">Most stores are approved within 24 hours. We'll text you on +234 ${esc(S.sel.phone)} and email you when it's done.</p>
   </div>
   <div class="vc-list a-rise" style="--d:.16s">${items.map(([i,t,s,d,res])=>`<div class="vc-row" data-res="${res}" style="--d:${d}s"><span class="vc-ic">${ic(i)}</span><div><b>${t}</b><span>${s}</span></div><span class="vc-st"><span class="q">Queued</span><span class="vc-spin"></span><span class="ok">${ic('check')}</span><span class="wait">In review</span></span></div>`).join('')}</div>
   <div class="spacer"></div>
   <div class="sticky-cta"><button class="btn" data-go="addprod">${ic('plus')}Add products while you wait</button><button class="demo" data-act="approve">${ic('play')}Prototype: finish verification now</button></div>`;},

vdone:()=>`<div class="status" style="margin:18px 0 20px">${confetti()}<div class="badge-ic green">${ic('check')}</div><h1>${esc(S.sel.store)} is verified</h1><p>Your store is live. Buyers see these badges on your store and every product you list.</p></div>
  <div class="a-rise" style="--d:.2s">${storeHeader(myStore(),false)}</div>
  <div class="spacer"></div>
  <div class="sticky-cta"><button class="btn" data-act="toseller">Go to my dashboard</button><button class="btn outline" data-act="mystore">See my store as buyers do</button></div>`,

sellerpage:()=>{const st=S.viewSeller==='__me'?myStore():SELLERS[S.viewSeller]; const prods=PRODUCTS.filter(p=>p.seller===st.name);
  return `${top('Store',`<button class="iconbtn" data-copy="agoramarket.ng/${slug(st.name)}" aria-label="Copy store link">${ic('share')}</button>`)}
  <div class="a-rise">${storeHeader(st,false)}</div>
  <div class="sp-stats a-rise" style="--d:.06s">
   <div><b>${st.rating?ic('star')+st.rating:'New'}</b><span>${st.reviews?st.reviews+' reviews':'No reviews yet'}</span></div>
   <div><b>${st.sales}</b><span>Sales</span></div>
   <div><b>${st.since}</b><span>Selling since</span></div>
  </div>
  <div class="trust a-rise" style="--d:.12s"><h3>${ic('shield')}Why you can trust this store</h3>
   ${trustRows(st).map(([i,t,s,neu],j)=>`<div class="tr ${neu?'neu':''}" style="--d:${(.35+j*.12).toFixed(2)}s"><span class="tr-ic">${ic(i)}</span><div><b>${t}</b><span>${esc(s)}</span></div><span class="tr-ck">${ic(neu?'info':'check')}</span></div>`).join('')}
   <p class="tr-foot">Agora checked these details before this store could sell. <button class="textlink" data-go="escrow">How escrow works</button></p>
  </div>
  <div class="infolist a-rise" style="--d:.18s">
   <div>${ic('msg')}<span>${esc(st.reply)}</span></div>
   <div>${ic('return')}<span>${esc(st.returns)}</span></div>
   ${st.ig?`<div>${ic('insta')}<span>Also on Instagram: <b>${esc(st.ig)}</b></span></div>`:''}
  </div>
  <div class="note amber a-rise" style="--d:.22s;margin-top:14px;padding:14px">${ic('lock')}<div><b>Only pay inside Agora</b><span>Escrow protects you only when you pay in the app. Report any seller who asks you to pay outside it.</span></div></div>
  ${st.revs.length?`<div class="sechead" style="margin-top:26px"><b>Reviews</b><span class="rate">${ic('star')}${st.rating} · ${st.reviews} reviews</span></div><div class="revs">${st.revs.map(([n,a,r,t])=>`<div class="rev"><div class="rev-h"><span class="rev-av">${initials(n)}</span><div><b>${n}</b><small>${a}</small></div><span class="rev-s">${stars5(r)}</span></div><p>${t}</p><span class="pill green" style="padding:4px 8px;align-self:flex-start">${ic('check')}Verified purchase</span></div>`).join('')}</div>`:''}
  ${prods.length?`<div class="sechead" style="margin-top:26px"><b>Products</b><small style="color:var(--muted)">${prods.length} items</small></div><div class="grid" style="margin-top:0">${prods.map(pcard).join('')}</div>`
   :`<div class="empty" style="padding:26px 0 0">${ic('pkg')}<b>No products yet</b><p>${st.own?'Products you add show here, with your verified badges.':'This store has not listed anything yet.'}</p>${st.own?`<button class="btn small" data-go="addprod" style="width:auto;padding:0 22px">${ic('plus')}Add your first product</button>`:''}</div>`}
  ${st.own?'':`<button class="textlink" style="display:block;margin:26px auto 0;color:var(--muted)" data-act="reportstore">Report this store</button>`}`;},

addprod:()=>`${top('Add a product')}
  <div class="intro" style="margin-top:0"><span>${ic('camera','icon-lg')}</span><h1 style="font-size:20px">Upload product images</h1><p>Add up to five clear photos. Buyers trust real photos over stock images.</p></div>
  <div class="imgs">${[0,1,2,3,4].map(i=>S.prodImgs[i]?`<div><img src="${S.prodImgs[i]}" alt="Product image ${i+1}"></div>`:i===S.prodImgs.length?`<label for="pi-in" aria-label="Add image">${ic('plus')}</label>`:`<div style="cursor:default;opacity:.5"></div>`).join('')}</div>
  <input type="file" id="pi-in" accept="image/*" multiple class="vh">
  <form class="form stagger" id="f-prod" novalidate style="margin-top:24px">
   ${field('pr-name','Product name','Wireless earbuds')}
   <div class="field"><label for="pr-cat">Category</label><div class="input"><select id="pr-cat"><option value="">Select category</option><option selected>Electronics</option><option>Phones</option><option>Bags</option><option>Fashion</option><option>Beauty</option><option>Home</option></select><span class="trail">${ic('down')}</span></div></div>
   ${field('pr-price','Price (₦)','25,000',{attrs:'inputmode="numeric"'})}
   <div class="err" id="pr-err"></div>
   <button class="btn" type="submit">Add product</button></form>`,

seller:()=>{
  const has=S.sellerHas!==false;
  const rows=[['p1','AG0123458','12 Oct 2026',45000,'Delivered'],['p2','AG0123459','14 Oct 2026',20000,'In escrow'],['p7','AG0123462','19 Oct 2026',52000,'Delivered'],['p10','AG0123470','24 Oct 2026',21000,'Dispatched']];
  const pill={Delivered:'green','In escrow':'amber',Dispatched:'blue'};
  return `<div class="brandbar"><div class="brand">${LOGO(false)}Agora</div><div style="display:flex;align-items:center;gap:6px"><button class="iconbtn" data-act="tobuyer" aria-label="Switch to buying">${ic('cart')}</button><button class="avatar" data-go="profile" aria-label="Profile">BK</button></div></div>
  <div class="greet"><h1>Good evening, ${esc(S.user.first)}</h1><button class="verified" data-act="mystore">${ic('badge')}Verified seller · ${esc(S.sel.store||S.store?.name||'Kuye Store')}${ic('chev')}</button></div>
  <div class="stats">
   <button class="stat g" data-go="paidout"><b>${has?'₦245,000':'₦0'}</b><span>Paid out</span></button>
   <button class="stat b" data-go="held"><b>${has?'₦72,000':'₦0'}</b><span>Held in escrow</span></button>
   <div class="stat"><b>${has?20+S.sellerProducts.length:S.sellerProducts.length}</b><span>Products live</span></div>
  </div>
  <div class="sechead"><b>Recent Orders</b>${has?'<button class="textlink">View all</button>':''}</div>
  ${has?`<div class="list-gap">${rows.map(([pid,id,d,a,s])=>`<div class="srow">${art(P(pid))}<div class="tx"><span>Order ID: #${id}</span><span>${d}</span><b>${N(a)}</b></div><span class="pill ${pill[s]}">${s}</span></div>`).join('')}</div>`
  :`<div class="empty">${ic('pkg')}<b>No orders yet</b><p>Share your store link. Buyers who see escrow protection convert better than buyers who do not.</p><button class="btn small" data-copy="agoramarket.ng/kuye-store" style="width:auto;padding:0 22px">${ic('copy')}Copy store link</button></div>`}
  <button class="demo" style="margin-top:20px" data-act="toggleseller">${ic('play')}Prototype: show ${has?'a new store with no orders':'a store with orders'}</button>`;
},

paidout:()=>`${top('Paid out')}
  <div class="bigsum">${ic('wallet')}<div class="tx"><small>Total paid out</small><b id="po-amt">₦245,000</b></div><button data-act="hideamt" aria-label="Hide amount">${ic('eye')}</button></div>
  <div class="stats" style="margin:16px 0 26px"><div class="stat"><span>Last 7 days</span><b>₦72,000</b></div><div class="stat"><span>Last 30 days</span><b>₦245,000</b></div><div class="stat"><span>Total orders</span><b>20</b></div></div>
  <div class="sechead"><b>Recent payouts</b></div>
  <div class="list-gap">${[[72000,'24 Oct 2026, 2:45 PM'],[45000,'19 Oct 2026, 11:10 AM'],[86000,'12 Oct 2026, 4:30 PM'],[42000,'5 Oct 2026, 9:05 AM']].map(([a,d])=>`<div class="srow"><span style="width:44px;height:44px;border-radius:12px;background:var(--blue-50);color:var(--blue);display:grid;place-items:center;flex:none">${ic('bank')}</span><div class="tx"><b style="font-weight:600">Payout to bank</b><span>GTBank, ***1234</span><span>${d}</span></div><div style="text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end"><span class="pill green">Completed</span><b style="font-variant-numeric:tabular-nums">${N(a)}</b></div></div>`).join('')}</div>`,

held:()=>`${top('Held in escrow')}
  <div class="bigsum">${ic('lock')}<div class="tx"><small>Total in escrow</small><b>₦72,000</b></div></div>
  <div class="note green" style="margin:16px 0 26px;padding:16px">${ic('shield')}<div><b>Escrow keeps everyone safe</b><span>Funds are released to you once the buyer confirms they've received the item in good condition.</span></div></div>
  <div class="sechead"><b>Orders with funds in escrow</b></div>
  <div class="list-gap">${[['p2','AGO1234','24 Oct 2026, 2:45 PM',20000],['p7','AGO1241','26 Oct 2026, 10:12 AM',52000]].map(([pid,id,d,a])=>`<div class="srow">${art(P(pid))}<div class="tx"><b style="font-weight:600">${P(pid).short}</b><span>Order #${id}</span><span>${d}</span></div><div style="text-align:right;display:flex;flex-direction:column;gap:8px;align-items:flex-end"><span class="pill amber">In escrow</span><b style="font-variant-numeric:tabular-nums">${N(a)}</b></div></div>`).join('')}</div>`
};

function pcard(p,i=0){
  return `<button class="pcard" data-pid="${p.id}" style="animation-delay:${Math.min(i,8)*.04}s">${art(p)}<span class="nm">${p.short}</span><span class="pr"><b>${N(p.price)}</b><span class="rate">${ic('star')}${p.rating}</span></span><span class="sl">${p.seller}</span><span class="escrow-chip">${ic('shield')}Escrow protected</span></button>`;
}

intro:(el)=>{
  const root=el.querySelector('.intro2'),stage=el.querySelector('.i-stage'),copy=el.querySelector('.i-copy'),nxt=el.querySelector('.i-next'),dots=[...el.querySelectorAll('.i-dots i')],glow=el.querySelector('.i-glow');

  const paint=i=>{const s=SLIDES[i]; root.style.backgroundColor=s.bg; root.style.color=s.fg; nxt.style.backgroundColor=s.nb; nxt.style.color=s.nf; if(meta) meta.content=s.bg; root.classList.toggle('last',i===2); nxt.classList.toggle('wide',i===2); nxt.setAttribute('aria-label',i===2?'Get started':'Next slide'); dots.forEach((d,j)=>d.classList.toggle('on',j===i)); glow.style.opacity=i===2?0:1;};
  const fit=slot=>{const f=slot.firstElementChild,m=f.firstElementChild; const h=slot.clientHeight-6,w=slot.clientWidth-8; const sc=Math.max(.5,Math.min(1.12,h/m.offsetHeight,w/m.offsetWidth)); const x=(slot.clientWidth-m.offsetWidth*sc)/2,y=Math.max(0,(slot.clientHeight-m.offsetHeight*sc)/2); f.style.transform=`translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${sc.toFixed(3)})`;};
  const mount=i=>{const slot=document.createElement('div'); slot.className='slot'; slot.innerHTML=`<div class="mock-fit">${SLIDES[i].m()}</div>`; stage.appendChild(slot); fit(slot);};
  const show=(i,dir)=>{ if(busy||i<0||i>2||i===idx) return; busy=true; const old=stage.querySelector('.slot:not(.leave)'); if(old){old.classList.add('leave'); if(dir<0) old.classList.add('rev'); setTimeout(()=>old.remove(),460);} idx=i; paint(i);
    setTimeout(()=>{ if(!el.isConnected) return; copy.innerHTML=`<h1>${SLIDES[i].t}</h1><p>${SLIDES[i].p}</p>`; copy.classList.remove('swap'); void copy.offsetWidth; copy.classList.add('swap'); mount(i); busy=false; },170); };
  paint(0); mount(0);

  const onKey=e=>{ if(!el.isConnected){removeEventListener('keydown',onKey);return;} if(e.key==='ArrowRight') show(idx+1,1); if(e.key==='ArrowLeft') show(idx-1,-1); };
  addEventListener('keydown',onKey);
  const refit=()=>{ const s=stage.querySelector('.slot:not(.leave)'); if(s) fit(s); };
  if(window.ResizeObserver){ new ResizeObserver(refit).observe(stage); } else addEventListener('resize',refit);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ if(el.isConnected) refit(); });

function form(el,sel,fn){const f=el.querySelector(sel); if(f) f.addEventListener('submit',e=>{e.preventDefault();fn();});}
function readImg(f,cb){ if(!f) return; const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,900/Math.max(img.width,img.height)); c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82));}; img.src=r.result; }; r.readAsDataURL(f); }

  const g=x.createLinearGradient(0,0,600,380);g.addColorStop(0,'#0B6E4F');g.addColorStop(1,'#14936A');x.fillStyle=g;x.fillRect(0,0,600,380);
  x.fillStyle='rgba(255,255,255,.92)';x.fillRect(30,90,150,190);x.fillStyle='#fff';x.font='bold 30px Inter, sans-serif';x.fillText('NATIONAL IDENTITY',30,60);
  [[210,120,300],[210,165,240],[210,210,280],[210,255,180]].forEach(([a,b,w])=>{x.fillStyle='rgba(255,255,255,.75)';x.fillRect(a,b,w,16);});
  x.fillStyle='#9AA3B2';x.beginPath();x.arc(105,165,38,0,7);x.fill();x.fillRect(60,210,90,60);
  x.fillStyle='#F59E0B';x.font='bold 16px Inter, sans-serif';x.fillText('SAMPLE · PROTOTYPE',390,350);return c.toDataURL('image/jpeg',.8);}

/* ---------- Event delegation ---------- */
app.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-act],[data-go],[data-back]'); if(!t) return;
  const d=t.dataset;
  if('back' in d){ back(); return; }
  if(d.go){ if(d.go==='newpw2'){go('newpw2');return;} go(d.go); return; }
  if(d.pid){ S.pid=d.pid; S.thumb=0; S.size=P(d.pid).sizes?.[3]||P(d.pid).sizes?.[0]||null; go('product'); return; }
  if(d.cat){ S.cat=d.cat; const sc=app.querySelector('.screen').scrollTop; render('home','none'); app.querySelector('.screen').scrollTop=sc; return; }
  if(d.thumb){ S.thumb=+d.thumb; const p=P(S.pid); const tints=[p.bg,'#E3E6EC','#ECE7DF','#E2E9F4']; app.querySelector('#hero-img').innerHTML=art(p,'art hero-img',tints[S.thumb]); app.querySelectorAll('.thumbs button').forEach((b,i)=>b.classList.toggle('on',i===S.thumb)); return; }
  if(d.size){ S.size=d.size; app.querySelectorAll('.sizes button').forEach(b=>{b.classList.toggle('on',b.dataset.size===d.size);b.setAttribute('aria-checked',b.dataset.size===d.size);}); return; }
  if(d.inc){ S.cart[+d.inc].qty++; render('cart','none'); return; }
  if(d.dec){ const c=S.cart[+d.dec]; if(c.qty>1) c.qty--; else S.cart.splice(+d.dec,1); render('cart','none'); return; }
  if(d.del){ const c=S.cart.splice(+d.del,1)[0]; render('cart','none'); toast(P(c.pid).short+' removed','trash'); return; }
  if(d.delM){ S.delivery=d.delM; app.querySelectorAll('[data-del-m]').forEach(b=>b.classList.toggle('on',b.dataset.delM===S.delivery)); return; }
  if(d.pay){ S.pay=d.pay; render('payment','none'); return; }
  if(d.copy){ try{await navigator.clipboard.writeText(d.copy);toast('Copied '+d.copy,'copy');}catch(_){toast(d.copy,'copy');} return; }
  if(d.star){ S.rating=+d.star; app.querySelectorAll('[data-star]').forEach(b=>b.classList.toggle('on',+b.dataset.star<=S.rating)); app.querySelector('#ratelbl').textContent=['','Poor','Fair','Good','Very good','Excellent'][S.rating]; app.querySelector('[data-act="submitrate"]').disabled=false; return; }
  if(d.otab){ S.otab=d.otab; render('orders','none'); return; }
  if(d.rm){ S.recent.splice(+d.rm,1); render('search','none'); return; }
  if(d.defaddr){ S.addresses.forEach((a,i)=>a.def=i===+d.defaddr); render('addresses','none'); toast('Default address updated'); return; }
  if(d.seller){ S.viewSeller=d.seller; go('sellerpage'); return; }
  if(d.goto){ S.swReturn=true; go(d.goto); return; }
  const a=d.act; if(!a) return;
  switch(a){
    case 'sell2': S.role='seller'; go(S.verify==='none'?'sw1':S.verify==='done'?'seller':'vcheck'); break;
    case 'mystore': S.viewSeller='__me'; go('sellerpage'); break;
    case 'reportstore': overlay(`<h3>Report this store</h3><p>We review every report within 24 hours. Any money of yours in escrow stays frozen while we look.</p><div class="list-gap">${['Fake or counterfeit items','Asked me to pay outside Agora','Rude or abusive','Something else'].map(x=>`<button class="radio-card" data-act="reported2"><span class="t"><b>${x}</b></span>${ic('chev')}</button>`).join('')}</div>`,true); break;
    case 'reported2': closeOverlay(); toast('Report sent. Thank you.','shield'); break;
    case 'swsubmit': { if(!app.querySelector('#confirm.on')){ err('rv-err','Tick the box to confirm your details are true.'); break; } processing('Submitting your store…','Your documents are sent securely',()=>{ S.verify='pending'; S.vcSeen=false; S.store={name:S.sel.store}; go('vcheck',{reset:true}); }); break; }
    case 'swsample3': case 'swsample4': case 'swsample5': { const sc=app.querySelector('.screen'); saveSW(sc);
      if(a==='swsample3') S.sel.cacDoc=sampleDoc('CERTIFICATE OF REGISTRATION','Corporate Affairs Commission · '+(S.sel.cac||'BN 3204718'),'#0B6E4F');

      if(a==='swsample5'){ S.sel.idDoc=sampleID(); S.sel.selfie=sampleSelfie(); if(!S.sel.idNum) S.sel.idNum='22183749561'; }
      render(sc.dataset.view,'none'); toast('Sample added'); break; }
    case 'oauth': processing('Connecting…','Signing you in securely',afterAuth); break;
    case 'oauthin': processing('Connecting…','Signing you in securely',()=>go('home',{reset:true})); break;
    case 'start': go('home',{reset:true}); break;
    case 'tick': t.classList.toggle('on'); t.setAttribute('aria-checked',t.classList.contains('on')); break;
    case 'pw': { const inp=t.parentElement.querySelector('input'); const show=inp.type==='password'; inp.type=show?'text':'password'; t.innerHTML=ic(show?'eye':'eyeoff'); break; }
    case 'resend': toast('A new code is on its way'); break;
    case 'verifyotp': go('newpw'); break;
    case 'tosignin': go('signin',{reset:true}); break;
    case 'add': {
      const p=P(S.pid); const ex=S.cart.find(c=>c.pid===p.id&&c.size===S.size);
      if(ex) ex.qty++; else S.cart.push({pid:p.id,size:S.size,qty:1});
      t.classList.add('success'); t.innerHTML=ic('check')+'Added to Cart';
      const bar=app.querySelector('.topbar div:last-child'); bar.innerHTML=cartBtn(); bar.querySelector('.badge').animate([{transform:'scale(1.6)'},{transform:'scale(1)'}],{duration:350,easing:'cubic-bezier(.34,1.56,.64,1)'});
      setTimeout(()=>{ if(!t.isConnected) return; t.classList.remove('success'); t.dataset.act=''; t.dataset.go='cart'; t.innerHTML='Go to cart'; },1100);
      break; }
    case 'tohome': go('home',{reset:true}); break;
    case 'paycard': {
      const n=val('cc-num').replace(/\s/g,''),ex=val('cc-exp'),cv=val('cc-cvv');
      if(n.length<16||!/^\d\d\/\d\d$/.test(ex)||cv.length<3) return err('cc-err','Enter the 16-digit card number, expiry as MM/YY and the 3-digit CVV.');
      processing('Securing your payment…','Funds go into escrow, not to the seller',()=>{placeOrder('held');go('success',{reset:true});});
      break; }
    case 'paytransfer': processing('Looking for your transfer…','This usually takes under a minute',()=>{placeOrder('awaiting');go('pending',{reset:true});}); break;
    case 'confirmtransfer': processing('Checking with the bank…','Matching your transfer to this order',()=>{S.order.status='held';S.order.heldAt=now();go('success',{reset:true});}); break;
    case 'payfail': S.failOrder={id:newOrderId(),items:S.cart.map(c=>({...c})),total:subtotal()+fee(),status:'failed'}; processing('Securing your payment…','Funds go into escrow, not to the seller',()=>go('failed')); break;
    case 'retry': back(); break;
    case 'dismissfail': go('cart',{reset:true}); stack=['home','cart']; break;
    case 'trackcur': go(S.order.status==='awaiting'?'pending':S.order.status==='delivered'?'arrived':'track'); break;
    case 'pastorder': toast('Order details open here in the full app','info'); break;
    case 'simdispatch': S.order.status='dispatched'; S.order.dispAt=now(); render('track','none'); toast('Seller dispatched your order','truck'); break;
    case 'simdeliver': S.order.status='delivered'; S.order.delAt=now(); go('arrived'); break;
    case 'rider': overlay(`<h3>Contact your rider</h3><p>Tunde A. is on a bike, about 25 minutes away. Agora masks both numbers.</p><div class="acct"><div><small>Rider line</small><b>0700 AGORA 01</b></div><button class="copy" data-copy="070024672 01">${ic('copy')}Copy</button></div><button class="btn" data-act="closeov">Done</button>`,true); break;
    case 'closeov': closeOverlay(); break;
    case 'problem': overlay(`<h3>Report a problem</h3><p>Your ${N(S.order.total)} stays in escrow while we look into it. The seller is not paid until this is resolved.</p><div class="list-gap">${['Item is damaged','Wrong item or size','Item not as described','Missing items'].map(x=>`<button class="radio-card" data-act="reported"><span class="t"><b>${x}</b></span>${ic('chev')}</button>`).join('')}</div>`,true); break;
    case 'reported': closeOverlay(); toast('Report sent. Funds stay frozen.','shield'); break;
    case 'skipphoto': S.photo=await samplePhoto(); render('confirm','none'); break;
    case 'confirmed': S.order.status='released'; S.orders.unshift({id:S.order.id,pid:S.order.items[0].pid,total:S.order.total,date:'28 Oct 2026',status:'completed'}); go('delivered',{reset:true}); S.order.status='released'; stack=['home','delivered']; break;
    case 'submitrate': toast('Thanks for rating '+P(S.order.items[0].pid).seller); S.rating=0; S.photo=null; S.order=null; go('home',{reset:true}); break;
    case 'clearrecent': S.recent=[]; render('search','none'); break;
    case 'editaddr': toast('Address editing opens here in the full app','info'); break;
    case 'addaddr': overlay(`<h3>Add new address</h3><div class="form">${field('na-label','Label','Office')}${field('na-line','Address','')}<button class="btn" data-act="saveaddr">Save address</button></div>`,true); break;
    case 'saveaddr': { const l=val('na-line'); if(!l){toast('Enter an address first','err');break;} S.addresses.push({label:val('na-label')||'Other',line:l,line2:'Lagos',def:false}); closeOverlay(); render('addresses','none'); toast('Address saved'); break; }
    case 'support': overlay(`<h3>Contact support</h3><p>Agora support replies within 15 minutes, 7am to 10pm daily.</p><div class="acct"><div><small>Email</small><b style="font-size:15px">help@agoramarket.ng</b></div><button class="copy" data-copy="help@agoramarket.ng">${ic('copy')}Copy</button></div><button class="btn" data-act="closeov">Done</button>`,true); break;
    case 'soon': toast('This section opens here in the full app','info'); break;
    case 'logout': S.order=null; S.cart=[]; S.rolePicked=false; go('role',{reset:true}); break;
    case 'twofa': S.twofa=!S.twofa; t.classList.toggle('on',S.twofa); t.setAttribute('aria-checked',S.twofa); toast(S.twofa?'Two-factor authentication on':'Two-factor authentication off',S.twofa?'shield':'info'); break;
    case 'approve': { S.verify='done'; const sc=app.querySelector('.screen'); const rows=[...app.querySelectorAll('.vc-row:not(.ok)')];
      rows.forEach((r,i)=>setTimeout(()=>{ r.dataset.res='ok'; r.classList.remove('wait','run'); r.classList.add('ok'); sc._upd&&sc._upd(); },250+i*380));
      setTimeout(()=>{ if(app.querySelector('.screen')===sc) go('vdone',{reset:true}); },900+rows.length*380); break; }
    case 'toseller': S.role='seller'; if(!S.store) S.store={name:S.sel.store}; go('seller',{reset:true}); break;
    case 'tobuyer': S.role='buyer'; go('home',{reset:true}); break;
    case 'toggleseller': S.sellerHas=S.sellerHas===false; render('seller','none'); break;
    case 'hideamt': { const b=app.querySelector('#po-amt'); const h=b.textContent.includes('•'); b.textContent=h?'₦245,000':'₦ • • • • •'; t.innerHTML=ic(h?'eye':'eyeoff'); break; }
  }
});

app.addEventListener('animationend',e=>{ const t=e.target; if(!t.closest||t.closest('.mock')) return; if(t.matches('.stagger > *,.a-rise,.a-fade,.a-drop,.a-pop,.pcard,.citem,.orow,.srow')) t.style.animation='none'; });

go('splash');
if('serviceWorker' in navigator && location.protocol==='https:' && location.hostname!=='localhost'){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
})();
</script>
</body>
</html>
