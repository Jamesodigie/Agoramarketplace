name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Copy the web app into www/
        run: npm run web

      - name: Create the Android project
        run: npx cap add android

      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0B3C91' --splashBackgroundColor '#0B3C91'

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Set version from build number
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Use the shared signing key (so updates install over old versions)
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Agora.apk

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agora-apk
          path: Agora.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Agora 1.0.${{ github.run_number }}
          body: |
            Install on Android: download **Agora.apk** below on your phone, open it, and allow "Install unknown apps" for your browser when asked.
            Built from ${{ github.sha }}.
          files: Agora.apk
          make_latest: true
